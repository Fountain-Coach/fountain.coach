<svg xmlns="http://www.w3.org/2000/svg" viewBox="59 109 649 598" width="649" height="598" role="img"><g id="composition"><rect x="95" y="145" width="90" height="6" fill="#272725" stroke="None" stroke-width="0" /><text x="95" y="204" font-family="Arial" font-size="46" fill="#272725" font-weight="bold" text-anchor="start">THE PAGE</text><text x="95" y="239" font-family="Arial" font-size="15" fill="#68645e" font-weight="normal" text-anchor="start" letter-spacing="2">ONE PASSAGE / SECOND SETTING</text><text x="95" y="302" font-family="Arial" font-size="23" fill="#272725" font-weight="normal" text-anchor="start">A page is not a container in which words happen to rest.</text><text x="95" y="334" font-family="Arial" font-size="23" fill="#272725" font-weight="normal" text-anchor="start">It is a decision about what can be read, where the eye</text><text x="95" y="366" font-family="Arial" font-size="23" fill="#272725" font-weight="normal" text-anchor="start">must return, and what may still be added. The same</text><text x="95" y="398" font-family="Arial" font-size="23" fill="#272725" font-weight="normal" text-anchor="start">sentence can stand in a narrow measure or cross a wide</text><text x="95" y="430" font-family="Arial" font-size="23" fill="#272725" font-weight="normal" text-anchor="start">field; neither setting changes the sentence, yet each</text><text x="95" y="462" font-family="Arial" font-size="23" fill="#272725" font-weight="normal" text-anchor="start">changes its pace. At the edge of the text another kind of</text><text x="95" y="494" font-family="Arial" font-size="23" fill="#272725" font-weight="normal" text-anchor="start">writing may begin. The margin is not the absence of</text><text x="95" y="526" font-family="Arial" font-size="23" fill="#272725" font-weight="normal" text-anchor="start">composition. It is a place held open for the work to</text><text x="95" y="558" font-family="Arial" font-size="23" fill="#272725" font-weight="normal" text-anchor="start">continue.</text><text x="95" y="667" font-family="Arial" font-size="15" fill="#68645e" font-weight="normal" text-anchor="start" letter-spacing="1">SAME SOURCE / SOURCE UNIT 01</text></g></svg>