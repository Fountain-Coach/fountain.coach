<svg xmlns="http://www.w3.org/2000/svg" viewBox="229 79 742 602" width="742" height="602" role="img"><g id="composition"><text x="600" y="149" font-family="Georgia" font-size="37" fill="#272725" font-weight="normal" text-anchor="middle" letter-spacing="5">THE PAGE</text><line x1="265" y1="175" x2="935" y2="175" stroke="#68645e" stroke-width="1" /><text x="265" y="233" font-family="Georgia" font-size="23" fill="#272725" font-weight="normal" text-anchor="start">A page is not a container in which words happen to rest. It</text><text x="265" y="267" font-family="Georgia" font-size="23" fill="#272725" font-weight="normal" text-anchor="start">is a decision about what can be read, where the eye must</text><text x="265" y="301" font-family="Georgia" font-size="23" fill="#272725" font-weight="normal" text-anchor="start">return, and what may still be added. The same sentence can</text><text x="265" y="335" font-family="Georgia" font-size="23" fill="#272725" font-weight="normal" text-anchor="start">stand in a narrow measure or cross a wide field; neither</text><text x="265" y="369" font-family="Georgia" font-size="23" fill="#272725" font-weight="normal" text-anchor="start">setting changes the sentence, yet each changes its pace. At</text><text x="265" y="403" font-family="Georgia" font-size="23" fill="#272725" font-weight="normal" text-anchor="start">the edge of the text another kind of writing may begin. The</text><text x="265" y="437" font-family="Georgia" font-size="23" fill="#272725" font-weight="normal" text-anchor="start">margin is not the absence of composition. It is a place</text><text x="265" y="471" font-family="Georgia" font-size="23" fill="#272725" font-weight="normal" text-anchor="start">held open for the work to continue.</text><text x="265" y="641" font-family="Arial" font-size="15" fill="#68645e" font-weight="normal" text-anchor="start" letter-spacing="1">SOURCE UNIT 01   /   SAME SOURCE</text></g></svg>