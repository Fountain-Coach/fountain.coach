<svg xmlns="http://www.w3.org/2000/svg" viewBox="56 111 969 520" width="969" height="520" role="img"><g id="composition"><text x="92" y="182" font-family="Georgia" font-size="38" fill="#272725" font-weight="normal" text-anchor="start">A LINE OF TYPE</text><text x="92" y="218" font-family="Georgia" font-size="21" fill="#68645e" font-weight="normal" text-anchor="start" font-style="italic">A single cast slug, a deliberate measure.</text><rect x="122" y="324" width="104" height="119" fill="none" stroke="#272725" stroke-width="1" /><text x="174" y="406" font-family="Georgia" font-size="66" fill="#272725" font-weight="normal" text-anchor="middle">L</text><rect x="231" y="324" width="104" height="119" fill="none" stroke="#272725" stroke-width="1" /><text x="283" y="406" font-family="Georgia" font-size="66" fill="#272725" font-weight="normal" text-anchor="middle">I</text><rect x="340" y="324" width="104" height="119" fill="none" stroke="#272725" stroke-width="1" /><text x="392" y="406" font-family="Georgia" font-size="66" fill="#272725" font-weight="normal" text-anchor="middle">N</text><rect x="449" y="324" width="104" height="119" fill="none" stroke="#272725" stroke-width="1" /><text x="501" y="406" font-family="Georgia" font-size="66" fill="#272725" font-weight="normal" text-anchor="middle">O</text><rect x="558" y="324" width="104" height="119" fill="none" stroke="#272725" stroke-width="1" /><text x="610" y="406" font-family="Georgia" font-size="66" fill="#272725" font-weight="normal" text-anchor="middle">T</text><rect x="667" y="324" width="104" height="119" fill="none" stroke="#272725" stroke-width="1" /><text x="719" y="406" font-family="Georgia" font-size="66" fill="#272725" font-weight="normal" text-anchor="middle">Y</text><rect x="776" y="324" width="104" height="119" fill="none" stroke="#272725" stroke-width="1" /><text x="828" y="406" font-family="Georgia" font-size="66" fill="#272725" font-weight="normal" text-anchor="middle">P</text><rect x="885" y="324" width="104" height="119" fill="none" stroke="#272725" stroke-width="1" /><text x="937" y="406" font-family="Georgia" font-size="66" fill="#272725" font-weight="normal" text-anchor="middle">E</text><text x="92" y="590" font-family="Georgia" font-size="23" fill="#272725" font-weight="normal" text-anchor="start" font-style="italic">The line is a unit of casting; meaning exceeds the line.</text></g></svg>