<svg xmlns="http://www.w3.org/2000/svg" viewBox="61 108 1040 497" width="1040" height="497" role="img"><g id="composition"><text x="97" y="169" font-family="Arial" font-size="18" fill="#9e594b" font-weight="normal" text-anchor="start">01</text><text x="169" y="169" font-family="Georgia" font-size="27" fill="#272725" font-weight="normal" text-anchor="start">The source survives the setting.</text><line x1="169" y1="184" x2="1065" y2="184" stroke="#bcb6ab" stroke-width="1" /><text x="97" y="246" font-family="Arial" font-size="18" fill="#9e594b" font-weight="normal" text-anchor="start">02</text><text x="169" y="246" font-family="Georgia" font-size="27" fill="#272725" font-weight="normal" text-anchor="start">The measure is declared.</text><line x1="169" y1="261" x2="1065" y2="261" stroke="#bcb6ab" stroke-width="1" /><text x="97" y="323" font-family="Arial" font-size="18" fill="#9e594b" font-weight="normal" text-anchor="start">03</text><text x="169" y="323" font-family="Georgia" font-size="27" fill="#272725" font-weight="normal" text-anchor="start">White space is available for work.</text><line x1="169" y1="338" x2="1065" y2="338" stroke="#bcb6ab" stroke-width="1" /><text x="97" y="400" font-family="Arial" font-size="18" fill="#9e594b" font-weight="normal" text-anchor="start">04</text><text x="169" y="400" font-family="Georgia" font-size="27" fill="#272725" font-weight="normal" text-anchor="start">A mark is evidence before instruction.</text><line x1="169" y1="415" x2="1065" y2="415" stroke="#bcb6ab" stroke-width="1" /><text x="97" y="477" font-family="Arial" font-size="18" fill="#9e594b" font-weight="normal" text-anchor="start">05</text><text x="169" y="477" font-family="Georgia" font-size="27" fill="#272725" font-weight="normal" text-anchor="start">A position event is not a source identity.</text><line x1="169" y1="492" x2="1065" y2="492" stroke="#bcb6ab" stroke-width="1" /><text x="97" y="554" font-family="Arial" font-size="18" fill="#9e594b" font-weight="normal" text-anchor="start">06</text><text x="169" y="554" font-family="Georgia" font-size="27" fill="#272725" font-weight="normal" text-anchor="start">Only the writer authorizes revision.</text><line x1="169" y1="569" x2="1065" y2="569" stroke="#bcb6ab" stroke-width="1" /></g></svg>