<svg xmlns="http://www.w3.org/2000/svg" viewBox="74 138 1054 511" width="1054" height="511" role="img"><g id="composition"><text x="110" y="219" font-family="Georgia" font-size="49" fill="#272725" font-weight="normal" text-anchor="start">FROM SHEET TO READER</text><text x="110" y="273" font-family="Georgia" font-size="29" fill="#68645e" font-weight="normal" text-anchor="start" font-style="italic">One source, another composition.</text><rect x="110" y="349" width="302" height="155" fill="none" stroke="#272725" stroke-width="1" /><text x="133" y="408" font-family="Arial" font-size="24" fill="#272725" font-weight="normal" text-anchor="start">SOURCE</text><text x="133" y="451" font-family="Georgia" font-size="20" fill="#68645e" font-weight="normal" text-anchor="start" font-style="italic">An admitted work</text><rect x="450" y="349" width="302" height="155" fill="none" stroke="#272725" stroke-width="1" /><text x="473" y="408" font-family="Arial" font-size="24" fill="#272725" font-weight="normal" text-anchor="start">PAGE</text><text x="473" y="451" font-family="Georgia" font-size="20" fill="#68645e" font-weight="normal" text-anchor="start" font-style="italic">A measured projection</text><rect x="790" y="349" width="302" height="155" fill="none" stroke="#272725" stroke-width="1" /><text x="813" y="408" font-family="Arial" font-size="24" fill="#272725" font-weight="normal" text-anchor="start">PROOF</text><text x="813" y="451" font-family="Georgia" font-size="20" fill="#68645e" font-weight="normal" text-anchor="start" font-style="italic">A material return</text><text x="110" y="606" font-family="Georgia" font-size="31" fill="#272725" font-weight="normal" text-anchor="start" font-style="italic">The page is complete only provisionally.</text></g></svg>