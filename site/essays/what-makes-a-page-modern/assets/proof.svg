<svg xmlns="http://www.w3.org/2000/svg" viewBox="44 77 1018 641" width="1018" height="641" role="img"><g id="composition"><text x="84" y="142" font-family="Georgia" font-size="31" fill="#272725" font-weight="normal" text-anchor="start" letter-spacing="3">THE PAGE</text><text x="84" y="170" font-family="Arial" font-size="15" fill="#68645e" font-weight="normal" text-anchor="start">PROOF 03 / ONE SOURCE</text><line x1="80" y1="189" x2="650" y2="189" stroke="#68645e" stroke-width="1" /><line x1="680" y1="130" x2="680" y2="665" stroke="#bcb6ab" stroke-width="1" /><text x="84" y="241" font-family="Georgia" font-size="20" fill="#272725" font-weight="normal" text-anchor="start">A page is not a container in which words</text><text x="84" y="270" font-family="Georgia" font-size="20" fill="#272725" font-weight="normal" text-anchor="start">happen to rest. It is a decision about</text><text x="84" y="299" font-family="Georgia" font-size="20" fill="#272725" font-weight="normal" text-anchor="start">what can be read, where the eye must</text><text x="84" y="328" font-family="Georgia" font-size="20" fill="#272725" font-weight="normal" text-anchor="start">return, and what may still be added. The</text><text x="84" y="357" font-family="Georgia" font-size="20" fill="#272725" font-weight="normal" text-anchor="start">same sentence can stand in a narrow</text><text x="84" y="386" font-family="Georgia" font-size="20" fill="#272725" font-weight="normal" text-anchor="start">measure or cross a wide field; neither</text><text x="84" y="415" font-family="Georgia" font-size="20" fill="#272725" font-weight="normal" text-anchor="start">setting changes the sentence, yet each</text><text x="84" y="444" font-family="Georgia" font-size="20" fill="#272725" font-weight="normal" text-anchor="start">changes its pace. At the edge of the text</text><text x="84" y="473" font-family="Georgia" font-size="20" fill="#272725" font-weight="normal" text-anchor="start">another kind of writing may begin. The</text><text x="84" y="502" font-family="Georgia" font-size="20" fill="#272725" font-weight="normal" text-anchor="start">margin is not the absence of composition.</text><text x="84" y="531" font-family="Georgia" font-size="20" fill="#272725" font-weight="normal" text-anchor="start">It is a place held open for the work to</text><text x="84" y="560" font-family="Georgia" font-size="20" fill="#272725" font-weight="normal" text-anchor="start">continue.</text><text x="84" y="679" font-family="Arial" font-size="13" fill="#68645e" font-weight="normal" text-anchor="start">FR–ESSAY–01 / UNIT 01 / PROOF NOT CORRECTED</text><text x="835" y="217" font-family="Georgia" font-size="32" fill="#68645e" font-weight="normal" text-anchor="start" font-style="italic">Außensteg</text><text x="835" y="249" font-family="Arial" font-size="19" fill="#68645e" font-weight="normal" text-anchor="start">outer margin</text><text x="835" y="643" font-family="Arial" font-size="14" fill="#68645e" font-weight="normal" text-anchor="start" letter-spacing="2">SPACE FOR THE HAND</text></g></svg>