<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">The listening room</title>
<desc id="desc">A technical architectural engraving in cream, charcoal and vermilion: a score and resonator face a listening instrument across a shared rehearsal room. Figure 04, Hearing / Rehearsal.</desc>
