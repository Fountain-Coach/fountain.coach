<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="t d">
<title id="t">The semantic ledger and the DOM projection</title><desc id="d">A source revision remains authoritative. A proposed change is compared with it, validated and authorized to produce a new semantic revision; the browser projects the admitted version but cannot author it by merely repainting.</desc>
<rect width="1400" height="820" fill="#f2eee5"/><rect x="29" y="28" width="1342" height="764" fill="none" stroke="#584f45"/>
<text x="76" y="80" font-family="monospace" letter-spacing="2.5" font-size="14" fill="#766c61">IV / SOURCE AND PROJECTION</text>
<text x="108" y="166" font-family="monospace" font-size="12" letter-spacing="1.4" fill="#8d5845">01 / FOUNTAINSTORE</text>
<rect x="103" y="195" width="355" height="392" fill="#fcfaf4" stroke="#776d60"/><path d="M119 229h322" stroke="#b0a798"/><text x="127" y="215" font-family="monospace" font-size="11" fill="#776d60">BOOK.REVISION / SHA-256</text>
<text x="133" y="278" font-family="Georgia,serif" font-size="29" fill="#403832">Authored meaning</text>
<g font-family="monospace" font-size="13" fill="#73695e"><text x="132" y="333">source:  A</text><text x="132" y="365">region:  voice-02</text><text x="132" y="397">role:    marginal</text><text x="132" y="429">action:  proposed</text><text x="132" y="462">owner:   writer</text></g>
<rect x="132" y="515" width="280" height="39" fill="#e9e4da" stroke="#b5a99a"/><text x="147" y="540" font-family="monospace" font-size="13" fill="#64594e">CANONICAL / NOT THE DOM</text>
<path d="M458 402h80" stroke="#995c44" stroke-width="1.6"/><path d="m529 395 10 7-10 7" fill="none" stroke="#995c44"/>
<text x="565" y="166" font-family="monospace" font-size="12" letter-spacing="1.4" fill="#8d5845">02 / GOVERNED DIFF</text>
<rect x="548" y="195" width="304" height="392" fill="#fcfaf4" stroke="#776d60"/>
<g font-family="monospace" font-size="14" fill="#5c554c"><text x="572" y="266">SOURCE  A</text><text x="572" y="304">+ margin.voice</text><text x="572" y="335">+ audio.binding</text><text x="572" y="366">+ layout.anchor</text><text x="572" y="424">PREVIEW</text><text x="572" y="455">VALIDATION</text><text x="572" y="486">WRITER APPROVAL</text></g><path d="M572 393h252" stroke="#a9a092"/><text x="572" y="544" font-family="monospace" font-size="13" fill="#985d46">SOURCE B IF ADMITTED</text>
<path d="M852 402h80" stroke="#995c44" stroke-width="1.6"/><path d="m923 395 10 7-10 7" fill="none" stroke="#995c44"/>
<text x="962" y="166" font-family="monospace" font-size="12" letter-spacing="1.4" fill="#8d5845">03 / DOM PROJECTION</text>
<rect x="942" y="195" width="350" height="392" fill="#fcfaf4" stroke="#776d60"/>
<path d="M942 235h350" stroke="#a69c8f"/><circle cx="963" cy="215" r="4" fill="#9e6b52"/><text x="980" y="220" font-family="monospace" font-size="11" fill="#82796b">BROWSER / HOST</text>
<rect x="968" y="262" width="295" height="287" fill="#f8f5ed" stroke="#b4aa9b"/><path d="M1190 276v252" stroke="#c3b8a8"/>
<g stroke="#8b8278" stroke-width="1.5" opacity=".6"><path d="M989 311h175M989 335h170M989 359h155M989 383h172M989 407h154M989 431h167"/></g><g stroke="#a06048" stroke-width="3"><path d="M1211 328v34M1230 315v48M1249 334v29"/></g>
<text x="968" y="569" font-family="monospace" font-size="12" fill="#827568">RENDERED / NOT AUTHORITATIVE</text>
<path d="M106 663h1188" stroke="#b6ab9b"/><text x="106" y="707" font-family="Georgia,serif" font-size="25" fill="#51473c">A changed pixel is not a changed book.</text><text x="106" y="743" font-family="monospace" font-size="13" fill="#8a5a47">SOURCE → INSPECTABLE PROPOSAL → AUTHORIZED REVISION → PROJECTION</text>
</svg>