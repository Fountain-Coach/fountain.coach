<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="The right to remain empty"><title>The right to remain empty</title><desc>Two schematic sheets have comparable open space, but only one is deliberate.</desc><rect x="0" y="0" width="1100" height="640" rx="0" fill="#f7f4ec" stroke="none" stroke-width="0"/><path d="M64 70 L1036 70" stroke="#27302f" stroke-width="1.15" fill="none"/><text x="65" y="49" fill="#27302f" font-family="Georgia,serif" font-size="29" font-weight="normal" text-anchor="start">The right to remain empty</text><text x="105" y="117" fill="#27302f" font-family="Georgia,serif" font-size="17" font-weight="normal" text-anchor="start">A deliberate terminal leaf</text><text x="607" y="117" fill="#a75d43" font-family="Georgia,serif" font-size="17" font-weight="normal" text-anchor="start">A misplaced break before prose</text><rect x="116" y="139" width="343" height="371" rx="0" fill="#fffdf8" stroke="#27302f" stroke-width="1.15"/><rect x="621" y="139" width="343" height="371" rx="0" fill="#fffdf8" stroke="#27302f" stroke-width="1.15"/><path d="M136 181 L440.0 181" stroke="#27302f" stroke-width="1.8" fill="none"/><path d="M136 201 L440.0 201" stroke="#27302f" stroke-width="1.8" fill="none"/><path d="M136 221 L440.0 221" stroke="#27302f" stroke-width="1.8" fill="none"/><path d="M136 241 L324.48 241" stroke="#27302f" stroke-width="1.8" fill="none"/><text x="136" y="294" fill="#27302f" font-family="Georgia,serif" font-size="17" font-weight="normal" text-anchor="start">Chapter ends here.</text><path d="M640 181 L940.0 181" stroke="#27302f" stroke-width="1.8" fill="none"/><path d="M640 201 L940.0 201" stroke="#27302f" stroke-width="1.8" fill="none"/><path d="M640 221 L940.0 221" stroke="#27302f" stroke-width="1.8" fill="none"/><path d="M640 241 L826.0 241" stroke="#27302f" stroke-width="1.8" fill="none"/><text x="640" y="294" fill="#27302f" font-family="Georgia,serif" font-size="17" font-weight="normal" text-anchor="start">A paragraph continues...</text><text x="638" y="469" fill="#a75d43" font-family="Georgia,serif" font-size="14" font-weight="normal" text-anchor="start">Next source block displaced</text><path d="M481 322 L598 322" stroke="#686e68" stroke-width="1" fill="none"/><text x="540" y="306" fill="#686e68" font-family="Georgia,serif" font-size="13" font-weight="normal" text-anchor="middle">≈ SAME</text><text x="540" y="337" fill="#686e68" font-family="Georgia,serif" font-size="13" font-weight="normal" text-anchor="middle">OPEN AREA</text><text x="115" y="548" fill="#686e68" font-family="Georgia,serif" font-size="15" font-weight="normal" text-anchor="start">Space belongs to the chapter ending.</text><text x="620" y="548" fill="#686e68" font-family="Georgia,serif" font-size="15" font-weight="normal" text-anchor="start">Space is an artifact of pagination.</text><path d="M64 582 L1036 582" stroke="#27302f" stroke-width="1" fill="none"/><text x="66" y="611" fill="#686e68" font-family="Georgia,serif" font-size="12" font-weight="normal" text-anchor="start">FOUNTAIN PRESS / THE PROOF OF THE PAGE</text><text x="1035" y="611" fill="#686e68" font-family="Georgia,serif" font-size="12" font-weight="normal" text-anchor="end">EXPLANATORY PLATE · NOT A LIVE SCREENSHOT</text></svg>