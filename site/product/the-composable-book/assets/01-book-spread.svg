<text x="80" y="83" font-family="monospace" font-size="14" letter-spacing="3" fill="#756d61">FOUNTAIN COACH / REFRAME</text><text x="1320" y="83" text-anchor="end" font-family="monospace" font-size="14" fill="#756d61">I / THE CODEX</text>
<rect x="120" y="144" width="1160" height="598" rx="2" fill="#a79d8c" opacity=".20" filter="url(#soft)"/>
