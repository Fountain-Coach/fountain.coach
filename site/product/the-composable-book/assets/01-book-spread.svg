<rect x="655" y="132" width="90" height="598" fill="url(#fold)"/>
<path d="M146 152v554M1254 152v554" stroke="#a59b8b" opacity=".25"/>
<text x="175" y="191" font-family="monospace" letter-spacing="2" font-size="12" fill="#736d61">VERSO / READING</text><text x="1228" y="191" text-anchor="end" font-family="monospace" letter-spacing="2" font-size="12" fill="#736d61">RECTO / COMPOSER</text>
<text x="175" y="272" font-family="Georgia,serif" font-size="42" fill="#302d29">The work</text><text x="175" y="324" font-family="Georgia,serif" font-size="42" fill="#302d29">remains a book.</text>
<g stroke="#837c71" stroke-width="2" opacity=".42"><path d="M175 377h390M175 411h370M175 445h401M175 479h346M175 513h399M175 547h365M175 581h385"/></g>
<text x="175" y="665" font-family="monospace" font-size="12" fill="#9b523f">SOURCE REVISION · ADMITTED</text>
<text x="786" y="264" font-family="monospace" font-size="12" letter-spacing="1.6" fill="#9b523f">WRITER</text><text x="786" y="303" font-family="Georgia,serif" font-size="26" fill="#332f2b">What if the margin could speak?</text>
<path d="M786 338h400" stroke="#a39b8d" stroke-width="1" opacity=".7"/>
<text x="786" y="380" font-family="monospace" font-size="12" letter-spacing="1.6" fill="#9b523f">MODEL</text><text x="786" y="422" font-family="Georgia,serif" font-size="23" fill="#332f2b">We can compose that relation,</text><text x="786" y="456" font-family="Georgia,serif" font-size="23" fill="#332f2b">without changing the source yet.</text>
<path d="M786 494h400" stroke="#a39b8d" stroke-width="1" opacity=".7"/>
<text x="786" y="574" font-family="Georgia,serif" font-size="21" font-style="italic" fill="#706a60">A proposed page form…</text><path d="M786 615h398" stroke="#6a645a" stroke-width=".9"/><text x="786" y="651" font-family="monospace" font-size="12" fill="#746d61">CONVERSATION · NOT YET A MUTATION</text>
<text x="700" y="782" text-anchor="middle" font-family="monospace" font-size="13" letter-spacing="1.7" fill="#696257">ONE WORK / ONE BINDING / TWO RELATED LEAVES</text>
