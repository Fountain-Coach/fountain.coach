<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 840" role="img" aria-labelledby="t d">
<title id="t">One book, two facing leaves</title><desc id="d">A continuous open cream folio. Admitted prose appears on the left, a restrained writer-model conversation on the right, and a recessed symmetrical central binding joins them.</desc>
<defs><linearGradient id="fold"><stop offset="0" stop-color="#ede8dd" stop-opacity="0"/><stop offset=".39" stop-color="#aaa397" stop-opacity=".16"/><stop offset=".5" stop-color="#81796c" stop-opacity=".23"/><stop offset=".61" stop-color="#aaa397" stop-opacity=".16"/><stop offset="1" stop-color="#ede8dd" stop-opacity="0"/></linearGradient><filter id="soft"><feGaussianBlur stdDeviation="15"/></filter></defs>
