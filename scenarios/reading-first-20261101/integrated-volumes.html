<template data-reader-volume="essays"><div class="book-flow" data-min-leaves="1"><section class="book-chapter" id="work-essays"><div class="book-chapter-heading"><h2>Essays — A Book Continually Written</h2></div></section><section class="book-chapter-text"><article class="book-prose"><p class="frame-lead">An evolving book. The newest authored chapter opens the reading sequence; the original edition and source addresses remain preserved.</p><p class="frame-toc-item"><a href="#/read/essay--the-door-is-a-score" data-reader-target="essay--the-door-is-a-score">The Door Is a Score</a></p><p class="frame-toc-item"><a href="#/read/essay--the-ear-that-learns" data-reader-target="essay--the-ear-that-learns">The Ear That Learns</a></p><p class="frame-toc-item"><a href="#/read/essay--the-composable-book" data-reader-target="essay--the-composable-book">The Composable Book</a></p><p class="frame-toc-item"><a href="#/read/essay--to-read-is-not-to-remember" data-reader-target="essay--to-read-is-not-to-remember">Did the Machine Actually Read the Book?</a></p><p class="frame-toc-item"><a href="#/read/essay--semantic-compilation-the-archive-is-not-the-edition" data-reader-target="essay--semantic-compilation-the-archive-is-not-the-edition">Semantic Compilation — The Archive Is Not the Edition</a></p><p class="frame-toc-item"><a href="#/read/essay--teatro-an-unfinished-composition" data-reader-target="essay--teatro-an-unfinished-composition">Teatro — An Unfinished Composition</a></p><p class="frame-toc-item"><a href="#/read/essay--reframe-and-the-business-value-of-the-estate" data-reader-target="essay--reframe-and-the-business-value-of-the-estate">Reframe and the Business Value of the Estate</a></p></article></section></div></template>
<template data-reader-volume="teatro"><div class="book-flow" data-min-leaves="1"><section class="book-chapter" id="work-teatro-an-unfinished-composition"><div class="book-chapter-heading"><h2 data-source-block="teatro-an-unfinished-composition.title">Teatro — An Unfinished Composition</h2></div></section><section class="book-chapter-text"><article class="book-prose"><figure class="frame-reading-figure" data-source-block="teatro-an-unfinished-composition.p1"><img loading="eager" decoding="sync" src="/estate/essays/teatro-an-unfinished-composition/assets/teatro-score-memory-vector-human-condition.svg" alt="Teatro Score Memory Vector: seven sequential movements from field and presence to an unfinished form" width="1200" height="630"/><figcaption>Teatro Score — Memory Vector · Plate 01 — Human Condition.</figcaption></figure><p data-source-block="teatro-an-unfinished-composition.p2" data-source-from="0" data-source-to="156">The human condition is not a completed story. It is a field of relations, memories, machines, absences, and acts of attention that we temporarily give form.</p><p data-source-block="teatro-an-unfinished-composition.p3" data-source-from="0" data-source-to="528">A human being is not a story. Stories are things we make afterwards: they have beginnings, causes, protagonists, and consequences. Human experience is less obedient. A smell enters a room and somebody dead for thirty years is suddenly present. A sentence said yesterday changes something that happened when we were twelve. A chair becomes a person. A photograph becomes evidence and then, years later, becomes a question. A machine remembers something we have forgotten. Someone we love stands beside us and remains unreachable.</p><p data-source-block="teatro-an-unfinished-composition.p4" data-source-from="0" data-source-to="526">These things coexist. This is where Teatro begins: not with theatre as an institution, a building, or a performance, but with the strange condition of being human. We inhabit a field containing more than can ever be reconciled into one account. Memory, body, language, objects, other people, machines, places, inherited images, desire, fear, and imagination continually enter this field. Some remain. Some disappear. Some return transformed. We usually call the resulting arrangement a self. Teatro treats it as a composition.</p><p class="frame-subheading" data-source-block="teatro-an-unfinished-composition.p5" data-source-from="0" data-source-to="31">The person is not in the middle</p><p data-source-block="teatro-an-unfinished-composition.p6" data-source-from="0" data-source-to="356">There is a persistent temptation to represent a human life by placing the human being at its centre. The portrait does this. Biography does it. Psychology frequently does it. Contemporary computation does it with profiles: preferences, histories, behaviours, and predictions accumulate around an individual until a model appears to know who that person is.</p><p data-source-block="teatro-an-unfinished-composition.p7" data-source-from="0" data-source-to="393">Teatro begins somewhere else. The human being is not necessarily the figure in the middle of the image. The human may be the relation between a table and an empty chair, between a sentence and the person who cannot answer it, or between an image remembered incorrectly and the place where something actually happened. A person can even be absent and remain the strongest presence in the field.</p><p data-source-block="teatro-an-unfinished-composition.p8" data-source-from="0" data-source-to="137">This is an old knowledge of theatre. Put an empty chair on a stage and wait long enough. It ceases to be furniture. Attention changes it.</p><p class="frame-subheading" data-source-block="teatro-an-unfinished-composition.p9" data-source-from="0" data-source-to="28">A score instead of an answer</p><p data-source-block="teatro-an-unfinished-composition.p10" data-source-from="0" data-source-to="424">For this reason Teatro produces scores. A score does not explain what something means; it establishes relations in time and space. Something enters. Something remains. Something crosses a boundary. Something answers. Something does not. A score can hold contradiction without repairing it and preserve uncertainty without turning uncertainty into failure. This makes the score an unusually precise model of human experience.</p><p data-source-block="teatro-an-unfinished-composition.p11" data-source-from="0" data-source-to="395">We continuously compose from material we did not choose. We inherit bodies, languages, families, histories, and places. Events happen before we understand them. Other people enter our lives carrying worlds inaccessible to us. Technologies extend our senses and memories while simultaneously changing what remembering means. We have limited sovereignty over any of this, yet we are not powerless.</p><p data-source-block="teatro-an-unfinished-composition.p12" data-source-from="0" data-source-to="215">We can attend. We can select. We can place one thing beside another. We can notice a relation that did not previously have a name. We can revise. We can refuse the premature ending. That small authority is enormous.</p><p class="frame-subheading" data-source-block="teatro-an-unfinished-composition.p13" data-source-from="0" data-source-to="34">Memory does not reproduce the past</p><p data-source-block="teatro-an-unfinished-composition.p14" data-source-from="0" data-source-to="327">Memory is often imagined as an archive. Teatro treats it more like a vector. A memory has direction. It arrives from somewhere, but its significance belongs partly to where it is going. The remembered thing changes because the person remembering has changed. The past therefore does not simply return. It acts upon the present.</p><p data-source-block="teatro-an-unfinished-composition.p15" data-source-from="0" data-source-to="369">An image from this morning can stand beside an image from childhood. A technical diagram can stand beside a garden. A fragment of conversation can meet a fictional character. None needs to surrender its origin. Their proximity produces a new condition. The Memory Vector gathers these traces. The Teatro Score asks what happens when one of them is given a place to act.</p><p data-source-block="teatro-an-unfinished-composition.p16" data-source-from="0" data-source-to="144">This is not autobiography in the conventional sense. The purpose is not to reconstruct what happened. It is to discover what is still happening.</p><p class="frame-subheading" data-source-block="teatro-an-unfinished-composition.p17" data-source-from="0" data-source-to="22">Theatre before theatre</p><p data-source-block="teatro-an-unfinished-composition.p18" data-source-from="0" data-source-to="437">Theatre begins long before somebody buys a ticket. It begins whenever attention creates a field in which relations become perceptible. A child arranges objects on a floor. Two people sit at opposite ends of a table. Someone speaks to a person who is no longer alive. A machine repeats a human voice. A photograph is placed beside another photograph and suddenly each changes the meaning of the other. These are already theatrical events.</p><p data-source-block="teatro-an-unfinished-composition.p19" data-source-from="0" data-source-to="292">The stage merely makes their structure visible. Teatro therefore understands theatre less as an art form than as a human technology: a method for giving temporary form to relationships that cannot otherwise be held still. The result does not need to resolve them. It needs to let us see them.</p><p class="frame-subheading" data-source-block="teatro-an-unfinished-composition.p20" data-source-from="0" data-source-to="28">The machine enters the field</p><p data-source-block="teatro-an-unfinished-composition.p21" data-source-from="0" data-source-to="312">Artificial intelligence makes this question newly urgent. For the first time, humans routinely encounter machines that can participate in language, interpretation, composition, and representation at enormous speed. The obvious question is whether the machine can create. Teatro is interested in another question:</p><p data-source-block="teatro-an-unfinished-composition.p22" data-source-from="0" data-source-to="28"><strong>Where does the human remain?</strong></p><p data-source-block="teatro-an-unfinished-composition.p23" data-source-from="0" data-source-to="274">Not by excluding the machine. The machine is already part of the field. It can remember, transform, propose, classify, generate, connect, and perform. It can produce images and voices. It can discover relationships a human has overlooked. But accumulation is not authorship.</p><p data-source-block="teatro-an-unfinished-composition.p24" data-source-from="0" data-source-to="320">The decisive human act may become increasingly small and increasingly important: <em>This. Here. Not that. Again. Leave it unresolved.</em> Authorship moves from possessing every means of production toward assuming responsibility for attention. The machine can generate possibilities. The human decides what is allowed to matter.</p><p class="frame-subheading" data-source-block="teatro-an-unfinished-composition.p25" data-source-from="0" data-source-to="25">An unfinished composition</p><p data-source-block="teatro-an-unfinished-composition.p26" data-source-from="0" data-source-to="440">Perhaps this is the human condition Teatro depicts. We arrive inside compositions already underway. We encounter other people whose inner worlds we cannot possess. We carry memories that alter while we remember them. We construct machines that become participants in the environment that constructed us. We continually make provisional arrangements from all of it and call those arrangements a day, a relationship, a work, sometimes a life.</p><p data-source-block="teatro-an-unfinished-composition.p27" data-source-from="0" data-source-to="212">Nothing guarantees coherence. And still we compose. The score is therefore never the final image of a person. It is evidence that, for one moment, somebody attended closely enough to make a constellation visible.</p><p data-source-block="teatro-an-unfinished-composition.p28" data-source-from="0" data-source-to="250">Tomorrow the relations may be different. Another thing will enter. Something that seemed central will move toward the edge. Something apparently insignificant will acquire enormous weight. The score can change. The human condition remains unfinished.</p><p data-source-block="teatro-an-unfinished-composition.p29" data-source-from="0" data-source-to="157">And perhaps our peculiar freedom lies precisely there: not in becoming masters of the field, but in remaining capable of attending to it, and giving it form.</p></article></section></div></template>

credits</a></p><p class="frame-reference-entry" data-source-block="door.note.19"><span class="frame-reference-number">19.</span> <a href="https://opengameart.org/content/100-cc0-metal-and-wood-sfx" target="_blank" rel="noopener noreferrer" aria-label="Open cited source: 100 CC0 metal and wood SFX">100 CC0 metal and wood SFX</a></p><p class="frame-reference-entry" data-source-block="door.note.20"><span class="frame-reference-number">20.</span> <a href="https://csound.com/" target="_blank" rel="noopener noreferrer" aria-label="Open cited source: Csound">Csound</a></p><p class="frame-reference-entry" data-source-block="door.note.21"><span class="frame-reference-number">21.</span> <a href="https://github.com/csound/csound/tree/7.0.0" target="_blank" rel="noopener noreferrer" aria-label="Open cited source: 7.0.0 source release">7.0.0 source release</a></p></article></section></div></template>
<template data-reader-volume="essay--the-door-is-a-score"><div class="book-flow" data-min-leaves="1"><section class="book-chapter" id="work-the-door-is-a-score"><div class="book-chapter-heading"><h2 data-source-block="the-door-is-a-score.title">The Door Is a Score</h2></div></section><section class="book-chapter-text"><article class="book-prose"><figure class="frame-reading-figure frame-integrated-figure" data-source-block="the-door-is-a-score.p1"><img loading="eager" decoding="sync" src="/estate/essays/the-door-is-a-score/assets/teatro-door-score.png" alt="Teatro graphic score: orange impacts and returning traces cross black spatial planes; a narrow threshold and a wide open interval hold the action in suspense." width="1774" height="887"/></figure><p data-source-block="the-door-is-a-score.p2" data-source-from="0" data-source-to="87">Geräuschemachen, semantic reading, and the passage from an audio file to a performance.</p><p data-source-block="the-door-is-a-score.p3" data-source-from="0" data-source-to="382">A door closes. The sound lasts less than the sentence that tells us about it. Yet it may tell us that someone has left quietly, that someone is being kept out, or that an ordinary room has become impossible to enter. The difference is made by a gesture, a place, and a moment. A catalogue can supply a recording of wood meeting wood. A performance must decide what the closing does.</p><p data-source-block="the-door-is-a-score.p4" data-source-from="0" data-source-to="614">This is the starting point for a new direction in the Fountain Coach estate: a semantic <em>read aloud</em> with two independently addressable performances for each textual expression. One carries the voice. The other carries the work of a <em>Geräuschemacher</em>: action, material, acoustic perspective, and chosen silence. Satzfunk provides the editorial listening context; Sing owns the vocal performance; SatzfunkPlayer is the playback instrument; Teatro connects the sound score to its engines. The listening study below makes a first part of that direction audible. The complete automatic integration remains work to be done.</p><p class="frame-subheading" data-source-block="the-door-is-a-score.p5" data-source-from="0" data-source-to="36">The studio was already an instrument</p><p data-source-block="the-door-is-a-score.p6" data-source-from="0" data-source-to="441">On 24 October 1924, Frankfurt’s SÜWRAG broadcast Hans Flesch’s <em>Zauberei auf dem Sender</em> live. The <a class="frame-note-link" href="#/read/notes--the-door-is-a-score" data-reader-target="notes--the-door-is-a-score" data-note-number="1">Deutsches Rundfunkarchiv’s account</a> identifies it as the first original radio play in German broadcasting history. A disruption of the broadcast becomes its subject: the apparatus and its competing programme elements enter the drama. No recording of that transmission survives; later productions are new performances of the surviving manuscript.</p><p data-source-block="the-door-is-a-score.p7" data-source-from="0" data-source-to="497">The distinction is useful here. A performance can survive as instructions without surviving as its original sound. Radio’s artists also learned to make meaning through the apparatus itself. The DRA describes their exploration of <a class="frame-note-link" href="#/read/notes--the-door-is-a-score" data-reader-target="notes--the-door-is-a-score" data-note-number="2">crossfading, cutting and montage</a>. An acoustic work could be composed from relations between sounds, rather than simply transmitted from a stage. Our proposal follows that possibility; it does not claim an unbroken technical lineage from those studios to this software.</p><p data-source-block="the-door-is-a-score.p8" data-source-from="0" data-source-to="482">The more immediate precedent is a working craft. In an <a class="frame-note-link" href="#/read/notes--the-door-is-a-score" data-reader-target="notes--the-door-is-a-score" data-note-number="3">interview with Marta Krus for the Goethe-Institut</a>, Geräuschemacher Max Bauer describes the importance of understanding a figure’s intentions and behaving through them. An available sound is not automatically the right performance. A falling object can acquire a different dramatic force according to how it is handled. His <a class="frame-note-link" href="#/read/notes--the-door-is-a-score" data-reader-target="notes--the-door-is-a-score" data-note-number="4">radio credits</a> place that practice in productions for ARD broadcasters and ORF, as well as live Hörspiel.</p><p data-source-block="the-door-is-a-score.p9" data-source-from="0" data-source-to="374">That is a demanding inheritance for a machine. The task is to connect a sonic gesture to a reading of the action, while keeping that reading open to correction. The sound performer’s responsibility remains artistic: a technically plausible impact can still misunderstand the scene. We are borrowing this craft’s question, rather than claiming to have automated its judgment.</p><p class="frame-subheading" data-source-block="the-door-is-a-score.p10" data-source-from="0" data-source-to="31">Listen to what the closing does</p><p data-source-block="the-door-is-a-score.p11" data-source-from="0" data-source-to="187">Four newly written microtexts direct three openly licensed recordings. Choose a direction, then listen. Each audition is fourteen seconds long; the final space belongs to the gesture too.</p><figure class="frame-press-av" data-press-media="satzfunk-player.recorded-directions.v1" data-keep-with-anchor="previous" data-source-block="door.av.recorded"><satzfunk-player label="Four performed directions of the door closing"></satzfunk-player><p class="press-av-status" role="status"></p><figcaption>Four authored recordings · fourteen seconds each · source score and interpretation retained.</figcaption></figure><figure class="frame-reading-figure" data-source-block="the-door-is-a-score.p12"><img loading="eager" decoding="sync" src="/estate/essays/the-door-is-a-score/assets/listening-score.png" alt="Measured waveforms of four Csound performances, showing the returning closing in memory and its absence in the withheld version." width="1536" height="768"/><figcaption>Actual rendered amplitudes on one scale. The graphic cannot decide whether the gesture is convincing.</figcaption></figure><p class="frame-subheading" data-source-block="the-door-is-a-score.p13" data-source-from="0" data-source-to="34">Source recordings, score and scope</p><p data-source-block="the-door-is-a-score.p14" data-source-from="0" data-source-to="225">Source sounds: rubberduck, <a class="frame-note-link" href="#/read/notes--the-door-is-a-score" data-reader-target="notes--the-door-is-a-score" data-note-number="5">100 CC0 metal and wood SFX</a> (2018): <code>keys_01.ogg</code>, <code>wood_squeak_01.ogg</code> and <code>wood_close_01.ogg</code>, under <a class="frame-note-link" href="#/read/notes--the-door-is-a-score" data-reader-target="notes--the-door-is-a-score" data-note-number="6">CC0 1.0</a>. The squeak is cast here as a hinge; that is our sound-design choice. <a href="/estate/essays/the-door-is-a-score/assets/keys.ogg" target="_blank" rel="noopener noreferrer">Keys</a> · <a href="/estate/essays/the-door-is-a-score/assets/wood-hinge.ogg" target="_blank" rel="noopener noreferrer">Squeak</a> · <a href="/estate/essays/the-door-is-a-score/assets/wood-close.ogg" target="_blank" rel="noopener noreferrer">Closure</a>.</p><p data-source-block="the-door-is-a-score.p15" data-source-from="0" data-source-to="257">The recorded and live versions share the <a href="/estate/essays/the-door-is-a-score/assets/score.mjs" target="_blank" rel="noopener noreferrer">same authored score and Csound orchestra</a>. The live engine is an unchanged local copy of <a class="frame-note-link" href="#/read/notes--the-door-is-a-score" data-reader-target="notes--the-door-is-a-score" data-note-number="7">@csound/browser 7.0.0</a>; <a href="/estate/essays/the-door-is-a-score/assets/vendor/LICENSE" target="_blank" rel="noopener noreferrer">wrapper licence</a>, <a href="/estate/essays/the-door-is-a-score/assets/vendor/THIRD_PARTY.md" target="_blank" rel="noopener noreferrer">third-party notices</a> and <a class="frame-note-link" href="#/read/notes--the-door-is-a-score" data-reader-target="notes--the-door-is-a-score" data-note-number="8">upstream source</a> are available. Csound core is <a href="/estate/essays/the-door-is-a-score/assets/vendor/CSOUND_CORE_LICENSE" target="_blank" rel="noopener noreferrer">LGPL-2.1-or-later</a>.</p><p data-source-block="the-door-is-a-score.p16" data-source-from="0" data-source-to="272">This exhibit is a sound-engine study with authored directions. It contains no generated narrator, no automatic semantic-model decision and no MIDI 2.0 dispatch. It is not a native Teatro Scenario admission or proof of estate-wide routing. See the <a href="/estate/essays/the-door-is-a-score/assets/evidence.json" target="_blank" rel="noopener noreferrer">source and render record</a>.</p><p class="frame-subheading" data-source-block="the-door-is-a-score.p17" data-source-from="0" data-source-to="28">A verb is not a sound effect</p><p data-source-block="the-door-is-a-score.p18" data-source-from="0" data-source-to="566">Start with the careful closing. Keys establish a hand at work; a squeak prepares the movement; a wooden closure completes it. Now hear the same events from the next room. Their order survives, but their acoustic address changes. The reader remains on this side of the wall. In the memory version, the gesture slows and returns. That recurrence is an authored interpretation of remembering, rather than a fact contained in a recording of a door. The final direction prepares the action and withholds its completion. Its most important event is the one we do not play.</p><p data-source-block="the-door-is-a-score.p19" data-source-from="0" data-source-to="461">These are modest choices, but they show what <em>semantic</em> must mean if the term is to earn its place. A reading has to distinguish a completed action from an intention, an intention from a refusal, and a memory from something taking place now. It has to retain a speaker, an addressee, a material and a perspective where the text supplies them. Where a reader supplies a motive or an acoustic treatment, that contribution must remain identifiable as interpretation.</p><p data-source-block="the-door-is-a-score.p20" data-source-from="0" data-source-to="475">A noun-to-sample lookup cannot make those distinctions. “She did not close the door” contains a door and a closing verb; a literal closing sound would contradict it. “She remembered closing it” introduces another time. A metaphor may call for no literal object at all. A semantic score must therefore carry conditions and relationships, including the decision to remain silent. The source words stay available, so a writer can challenge what the performance has made of them.</p><p class="frame-subheading" data-source-block="the-door-is-a-score.p21" data-source-from="0" data-source-to="32">Two performances, one expression</p><p data-source-block="the-door-is-a-score.p22" data-source-from="0" data-source-to="463">The proposed default gives each textual expression a source address and a pair of synchronized stems: <em>Stimme</em> and <em>Geräusche</em>. An expression is read in context, with the identities and acoustic conditions of its scene. A room can continue across a sentence boundary; an echo need not stop at the end of a paragraph. Separately addressable outputs let the estate route the voice and the surrounding action to different destinations while preserving their shared time.</p><p data-source-block="the-door-is-a-score.p23" data-source-from="0" data-source-to="543"><a class="frame-note-link" href="#/read/notes--the-door-is-a-score" data-reader-target="notes--the-door-is-a-score" data-note-number="9">Sing</a> would carry the renderer-neutral vocal intention into an OpenAI voice renderer. OpenAI’s <a class="frame-note-link" href="#/read/notes--the-door-is-a-score" data-reader-target="notes--the-door-is-a-score" data-note-number="10">official speech documentation</a> describes instruction-based direction of delivery; its current migration guidance points new work toward the Realtime API. A voice request can ask for restrained phrasing, but it cannot guarantee that every word or pause will arrive correctly. The resulting take needs its own verification and alignment. A different generated take is a new performance, with a new duration, not a transparent replacement for the first.</p><p data-source-block="the-door-is-a-score.p24" data-source-from="0" data-source-to="471">Satzfunk’s editorial context would bind that take to its reading. <a class="frame-note-link" href="#/read/notes--the-door-is-a-score" data-reader-target="notes--the-door-is-a-score" data-note-number="11">SatzfunkPlayer</a> would coordinate playback and seeking; <a class="frame-note-link" href="#/read/notes--the-door-is-a-score" data-reader-target="notes--the-door-is-a-score" data-note-number="12">Teatro</a> would govern the sound relationships and their execution. <a href="/estate/essays/the-ear-that-learns/" target="_blank" rel="noopener noreferrer">Ear’s earlier listening study</a> explains why observation remains separate from performance: an engine’s successful output is evidence that sound was made, not that the text was understood. The source, the interpretation, the take and the listening judgment need to remain distinguishable.</p><p class="frame-subheading" data-source-block="the-door-is-a-score.p25" data-source-from="0" data-source-to="33">Where meaning becomes a parameter</p><p data-source-block="the-door-is-a-score.p26" data-source-from="0" data-source-to="460">Csound supplies a particularly clear place to examine this passage. Its origins lie in Barry Vercoe’s work at MIT in the 1980s, and the <a class="frame-note-link" href="#/read/notes--the-door-is-a-score" data-reader-target="notes--the-door-is-a-score" data-note-number="13">current project</a> provides an open-source synthesis and signal-processing engine for desktop and browser use. In this study it plays samples, changes playback rate, filters them, places them in stereo and supplies reverberation. The words “remembered closing” are our direction. The engine receives concrete events and values.</p><p data-source-block="the-door-is-a-score.p27" data-source-from="0" data-source-to="477">The proposed estate integration adds an explicit binding between those two levels. A reading of careful movement can become a bounded excitation, a chosen envelope and a cue anchored to the actual spoken phrase. Perspective can become a declared spatial or acoustic parameter. Each mapping needs an engine, a parameter identity, a unit, a range and a transfer rule. The <a class="frame-note-link" href="#/read/notes--the-door-is-a-score" data-reader-target="notes--the-door-is-a-score" data-note-number="14">Csound Teatro contract</a> makes those relationships inspectable instead of allowing an adapter to invent them.</p><p data-source-block="the-door-is-a-score.p28" data-source-from="0" data-source-to="530">MIDI 2.0 is the intended typed control plane for the supported operations. It can deliver a note or controller value to an engine that declares how to receive it. It does not decide that a character is frightened, and it does not carry the resulting voice and Geräusche audio. OpenAI’s vocal directions travel through its API; the stems travel through audio paths. Meaning enters through the source-grounded score and its explicit mappings. Greater numerical precision is useful only after we have decided what the number governs.</p><p class="frame-subheading" data-source-block="the-door-is-a-score.p29" data-source-from="0" data-source-to="45">The episode can remain, and the room can open</p><p data-source-block="the-door-is-a-score.p30" data-source-from="0" data-source-to="420">A podcast can contain extraordinary acoustic art. Its distribution format imposes no artistic ceiling. What a conventional mixed episode gives its listener, however, is one rendered arrangement of the decisions made in production. An executable work can also retain the conditions from which another arrangement may be performed. The recording remains a valuable, stable edition; the score permits a different encounter.</p><p data-source-block="the-door-is-a-score.p31" data-source-from="0" data-source-to="568">Imagine keeping a narrator near while a remembered action returns from elsewhere; following a character through a doorway without moving the voice that remembers her; returning to an expression and hearing a second, explicitly different reading of its gesture. In an installation, the voice could remain in headphones while material actions occupy the room. In an accessible edition, the listener could keep the words clear while changing the spatial layer. These are proposed uses of separate performance routes, not capabilities established by the small study above.</p><p data-source-block="the-door-is-a-score.p32" data-source-from="0" data-source-to="354">The live recall gesture is narrower, and already audible: after a closing has passed, the reader can ask for its return. A new Csound event is made at that moment. The room’s memory is a compositional decision with a controllable consequence. It is a first experiment in letting an essay retain an action, rather than merely describe an audio technology.</p><p data-source-block="the-door-is-a-score.p33" data-source-from="0" data-source-to="496">The argument continues the estate’s earlier account of <a href="/estate/essays/semantic-compilation-the-archive-is-not-the-edition/" target="_blank" rel="noopener noreferrer">semantic compilation</a>: stored material becomes an edition through authored decisions. It also returns to <a href="/estate/essays/teatro-an-unfinished-composition/" target="_blank" rel="noopener noreferrer">Teatro’s unfinished composition</a>, where relations, attention and memory give a situation its form. Here that work begins with three recordings and a closing that can be heard differently. The next useful claim will be made when a real passage has acquired its voice, its Geräuschemacher performance, and two routes we can actually follow.</p><p class="frame-subheading" data-source-block="the-door-is-a-score.p34" data-source-from="0" data-source-to="29">Sources and listening credits</p><p data-source-block="the-door-is-a-score.p35" data-source-from="0" data-source-to="244">Ulrike Schlieper-Müller, <a class="frame-note-link" href="#/read/notes--the-door-is-a-score" data-reader-target="notes--the-door-is-a-score" data-note-number="15">“Zauberei auf dem Sender” von Hans Flesch (1924)</a>, ARD Hörspieldatenbank / DRA; and the DRA’s <a class="frame-note-link" href="#/read/notes--the-door-is-a-score" data-reader-target="notes--the-door-is-a-score" data-note-number="16">Weimar radio collection account</a>. Historical references are linked for reading; no archival broadcast audio is reproduced here.</p><p data-source-block="the-door-is-a-score.p36" data-source-from="0" data-source-to="220">Marta Krus with Max Bauer, <a class="frame-note-link" href="#/read/notes--the-door-is-a-score" data-reader-target="notes--the-door-is-a-score" data-note-number="17">Die Kunst der Geräusche</a>, Goethe-Institut; Max Bauer’s <a class="frame-note-link" href="#/read/notes--the-door-is-a-score" data-reader-target="notes--the-door-is-a-score" data-note-number="18">radio work and credits</a>. The essay derives a question for software from this practice; it does not attribute the software proposal to Bauer.</p><p data-source-block="the-door-is-a-score.p37" data-source-from="0" data-source-to="383">rubberduck, <a class="frame-note-link" href="#/read/notes--the-door-is-a-score" data-reader-target="notes--the-door-is-a-score" data-note-number="19">100 CC0 metal and wood SFX</a>, 4 July 2018. Three original Ogg recordings retained; converted to mono 48 kHz PCM for Csound. The source recordings retain that dedication; Fountain Coach retains the authored sound-score and publication rights. Publicly downloadable sound is not necessarily openly licensed sound: these particular recordings carry an explicit CC0 dedication.</p><p data-source-block="the-door-is-a-score.p38" data-source-from="0" data-source-to="243"><a class="frame-note-link" href="#/read/notes--the-door-is-a-score" data-reader-target="notes--the-door-is-a-score" data-note-number="20">Csound</a>, the <a class="frame-note-link" href="#/read/notes--the-door-is-a-score" data-reader-target="notes--the-door-is-a-score" data-note-number="21">7.0.0 source release</a>, and the local <a href="/estate/essays/the-door-is-a-score/assets/score.mjs" target="_blank" rel="noopener noreferrer">authored sound score</a>. The exhibit demonstrates Csound execution. Automatic semantic reading, OpenAI narration, native Teatro admission and MIDI 2.0 routing require their own integration evidence.</p></article></section></div></template>
<template data-reader-volume="essay--the-ear-that-learns"><div class="book-flow" data-min-leaves="1"><section class="book-chapter" id="work-the-ear-that-learns"><div class="book-chapter-heading"><h2 data-source-block="the-ear-that-learns.title">The Ear That Learns</h2></div></section><section class="book-chapter-text"><article class="book-prose"><figure class="frame-reading-figure" data-source-block="the-ear-that-learns.p1"><img loading="eager" decoding="sync" src="/estate/essays/the-ear-that-learns/assets/listening-room.png" alt="Architectural isometric engraving of a music score and sound source facing a listening instrument across an open rehearsal room, with one vermilion mark and figure caption 04 HEARING / REHEARSAL." width="1536" height="1024"/></figure><p data-source-block="the-ear-that-learns.p2" data-source-from="0" data-source-to="81">On a five-second phrase, an unfinished voice, and what a teacher asks us to hear.</p><p data-source-block="the-ear-that-learns.p3" data-source-from="0" data-source-to="452">At 2.15 seconds, in a recording barely longer than an inhalation, a consonant is supposed to begin. It is the <em>m</em> in <em>mi</em>. Until then, the little voice has carried <em>la</em> across two pitches without repeating its consonant. A third syllable, <em>na</em>, will follow. This is not an aria. It is a five-second rehearsal, and it has made us confront a question that no amount of successful sound generation can answer: did the intended syllable actually arrive in the ear?</p><p data-source-block="the-ear-that-learns.p4" data-source-from="0" data-source-to="439">Sing can make the recording. It has a native procedural voice, a score with four MIDI 2.0 notes, timed phonetic states, and a reproducible digital output. What it cannot yet do is confer intelligibility upon itself. If a machine knows the score before it listens, it may recognize the score instead of the sound. We therefore developed <a href="/instruments/#ear" target="_blank" rel="noopener noreferrer">Ear</a> as the separate listening boundary of <a href="/instruments/#sing" target="_blank" rel="noopener noreferrer">Sing</a>. The difference between them is where this essay begins.</p><p data-source-block="the-ear-that-learns.p5" data-source-from="0" data-source-to="571">Here are three actual renderings of that one short phrase. They were made by the Sing synthesizer, not by an opera singer; none is evidence of a naturalistic or qualified singing voice. They differ only in what the renderer is instructed to do with articulation and expression. Select the takes, follow the sound-addressed commentary, and return to the same instant in another performance. The player serves high-quality AAC listening derivatives made from checksum-verified original PCM; Ear's measurements refer to those source WAVs, not the compressed playback stream.</p><p data-source-block="the-ear-that-learns.p6" data-source-from="0" data-source-to="42">Listening study 01 · Original Sing renders</p><p class="frame-subheading" data-source-block="the-ear-that-learns.p7" data-source-from="0" data-source-to="25">One score, three attempts</p><p data-source-block="the-ear-that-learns.p8" data-source-from="0" data-source-to="42">05.20 seconds · AAC / source PCM at 48 kHz</p><p class="frame-subheading" data-source-block="the-ear-that-learns.p9" data-source-from="0" data-source-to="11">Articulated</p><p data-source-block="the-ear-that-learns.p10" data-source-from="0" data-source-to="44">Loading source-bound original audio witness.</p><p data-source-block="the-ear-that-learns.p11" data-source-from="0" data-source-to="32">SatzfunkPlayer / timed listening</p><p data-source-block="the-ear-that-learns.p12" data-source-from="0" data-source-to="61">No autoplay · private same-origin AAC · original PCM retained</p><p data-source-block="the-ear-that-learns.p13" data-source-from="0" data-source-to="31">Private research playback only.</p><p class="frame-subheading" data-source-block="the-ear-that-learns.p14" data-source-from="0" data-source-to="21">Comments on the sound</p><p data-source-block="the-ear-that-learns.p15" data-source-from="0" data-source-to="137">Choose a time to hear the actual passage. A timestamp names the recording position; Ear's acoustic measurement is not a lyric transcript.</p><p data-source-block="the-ear-that-learns.p16" data-source-from="0" data-source-to="118">Listening annotations require JavaScript. The recorded source identity remains available in the accompanying evidence.</p><p data-source-block="the-ear-that-learns.p17" data-source-from="0" data-source-to="33">Comment directly on what you hear</p><p data-source-block="the-ear-that-learns.p18" data-source-from="0" data-source-to="160">Write a listening observation and copy it with the selected take, exact playback time and original WAV checksum. This private essay stores and sends no comment.</p><p data-source-block="the-ear-that-learns.p19" data-source-from="0" data-source-to="27">Copy time-addressed comment</p><p data-source-block="the-ear-that-learns.p20" data-source-from="0" data-source-to="39">Nothing is submitted or auto-published.</p><p class="frame-subheading" data-source-block="the-ear-that-learns.p21" data-source-from="0" data-source-to="26">When the consonant changes</p><p data-source-block="the-ear-that-learns.p22" data-source-from="0" data-source-to="403">The plain take gives the initial comparison. On the second note, at 1.15 seconds, the vowel continues while the pitch changes: one syllable and two notes. This seemingly elementary fact matters. A music renderer can trigger four notes and mistakenly begin four syllables; a singer who understands melisma does not have to do that. The note belongs to the score, but the articulation belongs to the word.</p><p data-source-block="the-ear-that-learns.p23" data-source-from="0" data-source-to="553">Then the <em>m</em> begins. In the plain take its nasal onset is comparatively short. Sing's articulated version makes that onset longer and shapes its transition into the vowel. The voice itself remains procedural, but the contrast is real: in Ear's companion measurement, the onset's share of high-frequency energy falls by about eighty-four percent. At the following <em>n</em>, the reduction is about fifty-seven percent. The sustained vowels, meanwhile, remain relatively stable. Ear therefore selected the articulated take as the next acoustic development baseline.</p><p data-source-block="the-ear-that-learns.p24" data-source-from="0" data-source-to="692">We can say exactly what this decision means, and exactly what it does not. It means the two consonant regions now differ in a measured way from the first attempt. It does not mean that a person could understand <em>mi</em> or <em>na</em> without the text. The shipped Ear worklet observed activity, while a separately scoped comparison worklet measured spectral features. Neither was a source-blind phoneme recognizer. With the expressive version, where pitch bend, breath and vibrato enter, Ear found nineteen spectral onset candidates rather than five. There are still only three intended syllables. An onset counter that congratulated itself for finding nineteen words would be listening to the wrong thing.</p><p data-source-block="the-ear-that-learns.p25" data-source-from="0" data-source-to="314">This difference between noticing and understanding is easy to miss when a machine reports numbers so confidently. It is also the reason the project has begun to resemble a singing lesson more than a software demonstration. We had made a voice change its sound; now we needed to learn what constitutes a correction.</p><p class="frame-subheading" data-source-block="the-ear-that-learns.p26" data-source-from="0" data-source-to="30">Listening as an apprenticeship</p><p data-source-block="the-ear-that-learns.p27" data-source-from="0" data-source-to="463">In a European singing studio, the teacher does not usually begin with a general theory of acoustics. A phrase is sung, repeated, slowed, sometimes spoken, sometimes reduced to a single vowel. The pupil listens, attempts the gesture, hears an objection or a new demonstration, and attempts it again. The teacher's correction is specific to a voice and a passage. Musical technique is not detachable from the encounter in which someone learns to make a distinction.</p><p data-source-block="the-ear-that-learns.p28" data-source-from="0" data-source-to="547">Italian bel canto offers a useful comparison for the passage between the second and third notes. Its long cultivation of vowel continuity asks a singer to keep sound alive even as pitch and dynamics change. But a vowel must eventually make room for a consonant. Our tiny score has no historical Italian phrase and its synthetic voice has no living breath. What it shares with the lesson is a problem of attention: what remains continuous, and what must be newly articulated? One can return to the same two seconds and listen for that relationship.</p><p data-source-block="the-ear-that-learns.p29" data-source-from="0" data-source-to="487">In German Lied and operatic declamation, the same question moves toward language itself. A spoken word arrives already charged with stress and meaning before it enters the score. Consonant clusters are not clutter to be smoothed away; they can be the dramatic event. A sung <em>Licht</em> is not simply a sequence of sound classes with added pitch. It is an utterance, with a physical and rhetorical beginning. The machine that only measures a vowel's duration misses why that beginning mattered.</p><p data-source-block="the-ear-that-learns.p30" data-source-from="0" data-source-to="581">Spanish lyric theatre adds a further provocation. In zarzuela, speech can become song and then speech again within the same dramatic scene. One performer crosses the boundary while remaining the same character. It was natural for Sing to explore resynthesizing naturalistic speech toward song, but those experiments taught us the opposite of an easy technological triumph: moving the spectrum toward a stable vowel could make the word less recognizable. The sound grew more like singing while the language grew less clear. The voice cannot be rescued by an attractive timbre alone.</p><p data-source-block="the-ear-that-learns.p31" data-source-from="0" data-source-to="297">The European traditions do not form one pedagogy, and none of the three Sing recordings above performs bel canto, German declamation or zarzuela. They suggest instead why those practices are worth studying: a lesson has to notice something more particular than whether the output resembles a song.</p><p class="frame-subheading" data-source-block="the-ear-that-learns.p32" data-source-from="0" data-source-to="26">The rhythm is spoken first</p><p data-source-block="the-ear-that-learns.p33" data-source-from="0" data-source-to="521">That realization made an encounter with tabla pedagogy especially fruitful. In North Indian tabla teaching, the player may recite the <em>bols</em> that name rhythmic strokes before touching the drums. Hand gestures mark the <em>tala</em>, a cycle in which positions have relationships, not merely timestamps. The student repeats a phrase in the voice, feels where it returns, varies it within its rhythmic grammar, and then plays. The spoken structure is not a crude recording of a future performance. It is an active means of knowing it.</p><p data-source-block="the-ear-that-learns.p34" data-source-from="0" data-source-to="528">This does not turn tabla syllables into opera phonemes, any more than it makes a raga into a Western scale. Hindustani vocal <em>riyaz</em> belongs to its own teaching and listening practices: the drone, the swara, the voice approaching and returning to a note. But both remind us of something our digital archives can obscure. Transmission is not the storage of a finished sound. It is the repeated, often embodied relation between a demonstration and an attempt. Its smallest unit can be a gesture a student is asked to make once more.</p><p data-source-block="the-ear-that-learns.p35" data-source-from="0" data-source-to="523">The engineering consequence is surprisingly concrete. A teacher's reference, the student's recording, a musical score, a rhythmic cycle and an examiner's judgement are not interchangeable files. We must be able to connect them without giving the examiner the answer in advance. What the lesson supplies openly to Sing must not secretly enter Ear's source-blind test. A repetition can be compared with a previous performance; it cannot be called improvement merely because the same model made both the music and the verdict.</p><p class="frame-subheading" data-source-block="the-ear-that-learns.p36" data-source-from="0" data-source-to="36">The reference that could not be read</p><p data-source-block="the-ear-that-learns.p37" data-source-from="0" data-source-to="502">The Japanese recording preserved in Ear makes the danger visible. It is a real singer, independently recorded, accompanied by a phonetic annotation and a separate human revision of its timings. The original sequence counted seventy-one non-pause phonemes; the revision seventy-three. Many boundaries moved substantially. The disagreement does not mean human listening has failed. It means that the annotation is itself an accountable human interpretation rather than a transparent substitute for sound.</p><p data-source-block="the-ear-that-learns.p38" data-source-from="0" data-source-to="472">Ear's available experimental phoneme decoder was configured for English. It could observe vocal activity in the Japanese material; it could not thereby recognize Japanese phonemes. Feeding it the intended Japanese labels during inference would turn the test into a rehearsal of its answer sheet. The project kept that recognition gate blocked. There is real source evidence, but there is not yet independently qualified Japanese recognition, still less a qualified singer.</p><p data-source-block="the-ear-that-learns.p39" data-source-from="0" data-source-to="374">It matters that this refusal arrives in the midst of an argument about pedagogy. A good teacher does not pretend to have heard a consonant that remains uncertain; a good student is allowed to try again. The reference gives us something real against which future listening can be tested, but the act of listening must be performed without borrowing the reference's certainty.</p><p class="frame-subheading" data-source-block="the-ear-that-learns.p40" data-source-from="0" data-source-to="31">A second attempt, not a verdict</p><p data-source-block="the-ear-that-learns.p41" data-source-from="0" data-source-to="491">Return once more to the articulated <em>mi</em> at 2.15 seconds. The change is modest; the question it opens is large. We can name what Sing did, reproduce the same PCM, and describe what Ear measured. We cannot say that a tradition has been learned or that the music is good. Our first teaching contract therefore describes a cycle rather than a graduation: demonstration, imitation, independent listening, a bounded correction, another attempt, and finally a new phrase with which to test transfer.</p><p data-source-block="the-ear-that-learns.p42" data-source-from="0" data-source-to="425">It is tempting to imagine a future machine that produces a finished aria at the press of a button. This is a different ambition. We want instruments capable of a relationship in which hearing changes the next act of making. Sing should not be ashamed of an unfinished sound. Ear should be free to say that it cannot yet tell. And the writer should still be able to listen, contest, teach and decide what may enter an edition.</p><p data-source-block="the-ear-that-learns.p43" data-source-from="0" data-source-to="211">In the old recording the <em>m</em> will begin again at 2.15 seconds, exactly as before. In a real lesson the next attempt would not have to be identical. Perhaps that is the point at which an instrument begins to learn.</p><p data-source-block="the-ear-that-learns.p44" data-source-from="0" data-source-to="39">Listening and evidence remain distinct.</p><p data-source-block="the-ear-that-learns.p45" data-source-from="0" data-source-to="18">the MIDI 2.0 score</p><p data-source-block="the-ear-that-learns.p46" data-source-from="0" data-source-to="25">Ear's measured comparison</p><p data-source-block="the-ear-that-learns.p47" data-source-from="0" data-source-to="30">The Japanese annotation report</p><p data-source-block="the-ear-that-learns.p48" data-source-from="0" data-source-to="28">teaching-traditions contract</p><p data-source-block="the-ear-that-learns.p49" data-source-from="0" data-source-to="87"><a href="/estate/essays/the-ear-that-learns/" target="_blank" rel="noopener noreferrer">Open the original published work for its complete interactive listening or PDF exhibits</a></p></article></section></div></template>
<template data-reader-volume="essay--the-composable-book"><div class="book-flow" data-min-leaves="1"><section class="book-chapter" id="work-the-composable-book"><div class="book-chapter-heading"><h2 data-source-block="the-composable-book.title">The Composable Book</h2></div></section><section class="book-chapter-text"><article class="book-prose"><figure class="frame-reading-figure" data-source-block="the-composable-book.p1"><img loading="eager" decoding="sync" src="/estate/essays/the-composable-book/assets/01-book-spread.svg" alt="An open book is one composition. Reading and Composer meet at its binding; neither page is a docked application window." width="1400" height="820"/></figure><p data-source-block="the-composable-book.p2" data-source-from="0" data-source-to="399">The first mistake is easy to make. Put two rectangles side by side, give them the color of paper, draw a shadow between them, and call the result a book. The mistake becomes visible the moment somebody looks at the middle. One panel seems to rest upon the other. The gutter is a divider. On the right, the writer is still talking into a chat application. On the left, the work waits to be displayed.</p><p data-source-block="the-composable-book.p3" data-source-from="0" data-source-to="25">A book is not two panels.</p><p data-source-block="the-composable-book.p4" data-source-from="0" data-source-to="461">It is a continuity between reading and writing. What has been written changes what may be said next; what is said next may change the work. In <a href="/" target="_blank" rel="noopener noreferrer">Reframe</a>, the left and right leaves have begun to express that relation: the admitted work is read on one side, while the existing Composer—writer and model in conversation—occupies the other. The recent codex-facing implementation corrects the immediate visual problem. But the design question underneath it is larger.</p><p data-source-block="the-composable-book.p5" data-source-from="0" data-source-to="116"><em>What if the writer could compose not only the words of a book, but the kinds of pages a book is capable of becoming?</em></p><p class="frame-subheading" data-source-block="the-composable-book.p6" data-source-from="0" data-source-to="24">The book is not the page</p><p data-source-block="the-composable-book.p7" data-source-from="0" data-source-to="290">Printed books have trained us to mistake their material limitations for their definition. A recto follows a verso. The margin remains a margin. An image is still when the paper is still. This discipline has produced extraordinary literature, but it is not the limit of literary composition.</p><p data-source-block="the-composable-book.p8" data-source-from="0" data-source-to="402">A digital book can contain a score that sounds, a marginal voice that answers, an image that reveals another layer when approached, an annotated dramatic passage, or an instrument whose behavior can be inspected and revised. The book need not surrender its dignity as a book to accommodate any of these things. Its coherence comes from authored relationships, not from a permanent inventory of widgets.</p><p data-source-block="the-composable-book.p9" data-source-from="0" data-source-to="360">This is why <a href="https://works.benedikt-eickhoff.de/solstice/editions/first-reading/" target="_blank" rel="noopener noreferrer">First Reading</a> and <a href="https://teatro.fountain.coach/" target="_blank" rel="noopener noreferrer">Teatro</a> belong to the same larger investigation. One explores the measured reading of text; the other treats performance, memory, sound, and spatial relation as forms that can be composed. Neither must collapse into the other. A book should be able to contain both while making clear which kind of thing the reader is encountering.</p><p data-source-block="the-composable-book.p10" data-source-from="0" data-source-to="161">The question is no longer how to add a button to a page. It is how the writer and the model can <strong>author a new relation</strong> and let the book adopt an appropriate form.</p><p class="frame-subheading" data-source-block="the-composable-book.p11" data-source-from="0" data-source-to="27">Composer is inside the book</p><p data-source-block="the-composable-book.p12" data-source-from="0" data-source-to="380">The right page of Reframe is not merely an assistant attached to an editor. Composer is an instrument of dialogue. It is where the writer can ask what the work is doing, propose a line, reject the proposal, or invent a form that has no name yet. The model participates in that exploration; it does not acquire the right to alter the manuscript by declaring that it has understood.</p><p data-source-block="the-composable-book.p13" data-source-from="0" data-source-to="158">Imagine the writer saying: “Let this paragraph unfold into three voices. Put the second at the margin. I would like to hear them separately before they meet.”</p><p data-source-block="the-composable-book.p14" data-source-from="0" data-source-to="406">This is not a request for a particular React component. It is an artistic proposal. The writer and model may need to decide what counts as a voice, whether the voices are simultaneous, what their temporal relations are, and what the reader may control. The model might propose a structure that uses an existing <a href="https://teatro.fountain.coach/" target="_blank" rel="noopener noreferrer">Teatro</a> instrument. The writer may decline it and choose a purely typographic rendering instead.</p><p data-source-block="the-composable-book.p15" data-source-from="0" data-source-to="254">Only after such an understanding exists is there something precise enough to implement. The resulting structure can be offered, previewed, revised, and—when authorized—admitted to the book. The conversational path is open-ended. Its consequences are not.</p><p data-source-block="the-composable-book.p16" data-source-from="0" data-source-to="237">The <a href="https://governance.fountain.coach/chapters/58-open-turn-mediation-protocol/" target="_blank" rel="noopener noreferrer">open-turn mediation protocol</a>, used by the developing R27 collaboration scenario, begins to separate those responsibilities. It is a developing architectural contract, <strong>not yet evidence that every imagined composition can be performed</strong>.</p><figure class="frame-reading-figure" data-source-block="the-composable-book.p17"><img loading="eager" decoding="sync" src="/estate/essays/the-composable-book/assets/02-composition.svg" alt="A writer's open proposal becomes a typed composition only after its identities, relations, capabilities and authority have been resolved." width="1400" height="820"/><figcaption>FIG. 02A writer's open proposal becomes a typed composition only after its identities, relations, capabilities and authority have been resolved.</figcaption></figure><p class="frame-subheading" data-source-block="the-composable-book.p18" data-source-from="0" data-source-to="27">What the DOM makes possible</p><p data-source-block="the-composable-book.p19" data-source-from="0" data-source-to="364">The browser has spent decades learning to compose documents. The <a href="https://developer.mozilla.org/en-US/docs/Web/API/Document_Object_Model" target="_blank" rel="noopener noreferrer">Document Object Model</a> gives elements addresses and relationships; HTML supplies document structure, CSS presentation, SVG vector drawing, and browser APIs focus, selection, accessibility, input, audio, and animation. A web page is not just a sheet of text. It is an extraordinarily composable field.</p><p data-source-block="the-composable-book.p20" data-source-from="0" data-source-to="357">This is a useful foundation for Reframe. The book can have a canonical structure of its own, while a browser renders its current projection as a document. A paragraph, score, annotation, image, timeline, or stage can have an explicit identity. The writer could rearrange the relation between them without instructing a programmer to rebuild the application.</p><p data-source-block="the-composable-book.p21" data-source-from="0" data-source-to="365"><a href="https://react.dev/" target="_blank" rel="noopener noreferrer">React</a> is a good means of expressing interactive components against that surface. <a href="https://vite.dev/" target="_blank" rel="noopener noreferrer">Vite</a> is a fast build and development tool. They are not, however, the ontology of the book. The DOM is likewise not the definitive manuscript: a browser may insert rendering nodes, change layout in response to available space, or discard a temporary interaction when the page reloads.</p><p data-source-block="the-composable-book.p22" data-source-from="0" data-source-to="75"><strong>The DOM is a rich projection of an authored composition, not its authority.</strong></p><p data-source-block="the-composable-book.p23" data-source-from="0" data-source-to="485">That distinction protects the work. An observed change in the browser is not automatically a new edition. An offered transformation is not a source revision. An animation is not proof that its underlying scenario ran. The <a href="https://governance.fountain.coach/chapters/122-governed-semantic-transformation-instrument/" target="_blank" rel="noopener noreferrer">governed semantic transformation contract</a> explicitly separates the semantic State A → State B change from browser rendering and publication. <a href="https://governance.fountain.coach/chapters/124-midi2-timed-webkit-transitions/" target="_blank" rel="noopener noreferrer">MIDI 2.0-timed WebKit transitions</a> carry the same distinction into animation, focus, accessible slots, and correlated time.</p><p data-source-block="the-composable-book.p24" data-source-from="0" data-source-to="163">These are not bureaucratic refinements. They make creative freedom sustainable. If the book can become many things, it must also know precisely what it has become.</p><p class="frame-subheading" data-source-block="the-composable-book.p25" data-source-from="0" data-source-to="28">One work, more than one host</p><p data-source-block="the-composable-book.p26" data-source-from="0" data-source-to="455">A Linux computer need not imitate a Mac desktop to present Reframe. A browser can display the codex, render the same composed regions, and talk to admitted instruments. On a large screen, reading and Composer may occupy facing leaves. On a narrower iPad, the leaves may be encountered one at a time, with the relationship between them preserved. A headless Linux service needs no leaves at all: it must understand the same source revisions and operations.</p><p data-source-block="the-composable-book.p27" data-source-from="0" data-source-to="230">What travels between these environments is not a frozen screenshot. It is the identity of the work, its versioned semantic structure, its reading position, its conversational continuity, and the state of its authorized operations.</p><p data-source-block="the-composable-book.p28" data-source-from="0" data-source-to="280">The <a href="https://governance.fountain.coach/chapters/108-reframe-is-a-swift-native-cross-platform-runtime/" target="_blank" rel="noopener noreferrer">cross-platform runtime contract</a> already expresses this ambition at the Swift level. A portable codex must make it real for the book itself. A visual adjustment may be different on macOS and Linux. The meaning of a newly authored predicate or the identity of the source cannot.</p><figure class="frame-reading-figure" data-source-block="the-composable-book.p29"><img loading="eager" decoding="sync" src="/estate/essays/the-composable-book/assets/03-one-book-many-hosts.svg" alt="One canonical book revision yields different appropriate projections: facing leaves, a single leaf, or a headless semantic runtime." width="1400" height="820"/><figcaption>FIG. 03One canonical book revision yields different appropriate projections: facing leaves, a single leaf, or a headless semantic runtime.</figcaption></figure><p class="frame-subheading" data-source-block="the-composable-book.p30" data-source-from="0" data-source-to="29">Languages a writer can invent</p><p data-source-block="the-composable-book.p31" data-source-from="0" data-source-to="167">The writer's freedom becomes more interesting when it extends beyond choosing a layout. Why should the vocabulary of composition be fixed by the developers of Reframe?</p><p data-source-block="the-composable-book.p32" data-source-from="0" data-source-to="334">Suppose the writer wants a plate to <em>remember</em> a collision. That word might mean retaining a trace of the last excitation, letting it decay, and making the trace audible when another event occurs. Or it might mean something entirely different. The model's first task is not to write Swift. It is to help establish what the writer means.</p><p data-source-block="the-composable-book.p33" data-source-from="0" data-source-to="449">A new domain-specific language can then describe that relation precisely. If its semantics can be expressed through existing typed primitives, a compiled interpreter can load a new versioned language definition and validate it without rebuilding Reframe. If the new behavior requires an unavailable algorithm, the model may implement a separate Swift instrument, compile and test it, and propose its admission under the <a href="https://governance.fountain.coach/chapters/93-instrument-creation-is-a-governed-promotion-path/" target="_blank" rel="noopener noreferrer">instrument-creation contract</a>.</p><p data-source-block="the-composable-book.p34" data-source-from="0" data-source-to="231">This is the distinction between <strong>composing a new language</strong> and <strong>implementing a new primitive</strong>. The two operations have different risks, but neither requires adding another rule for what to do when the writer says a particular sentence.</p><p data-source-block="the-composable-book.p35" data-source-from="0" data-source-to="352">The <a href="https://governance.fountain.coach/chapters/83-conversational-scenario-authoring/" target="_blank" rel="noopener noreferrer">conversational scenario-authoring contract</a>, extended by the pinned R27 language-authoring decision, sets out that distinction. Its generic runtime-defined DSL engine is still an implementation target. <a href="https://governance.fountain.coach/chapters/151-csound-teatro-speaking-sound-in-space/" target="_blank" rel="noopener noreferrer">CsoundTeatro</a> is an existing, narrower example of the precision such a language requires, not proof that arbitrary new grammars can already execute.</p><p class="frame-subheading" data-source-block="the-composable-book.p36" data-source-from="0" data-source-to="37">The implementations we can build upon</p><p data-source-block="the-composable-book.p37" data-source-from="0" data-source-to="74">There is no need to pretend that this must begin with an empty repository.</p><p data-source-block="the-composable-book.p38" data-source-from="0" data-source-to="211">The Teatro Stage Web implementation already combines React, Vite, Three.js, physics, Csound, and MIDI 2.0-related bridge code. It demonstrates a browser environment capable of more than conventional text layout.</p><p data-source-block="the-composable-book.p39" data-source-from="0" data-source-to="236">The independently owned Domain Reasoning Portal uses a newer React/Vite stack and structured document components, with declared unit, accessibility, and browser-visual test workflows. It is closer to the editorial side of this argument.</p><p data-source-block="the-composable-book.p40" data-source-from="0" data-source-to="373">These are <strong>two working lines of development</strong>, not yet a unified cross-platform book. Their library versions differ; their component trees and semantic contracts are not interchangeable by assertion. The architectural opportunity is to make them both consumers of a shared, versioned composition contract, not to merge everything into one increasingly large React application.</p><p data-source-block="the-composable-book.p41" data-source-from="0" data-source-to="262">The browser then becomes one of Reframe's principal surfaces. Native applications retain the platform responsibilities they do best. Composer can make DOM-backed capabilities available to the writer when the governing instrument is actually present and admitted.</p><figure class="frame-reading-figure" data-source-block="the-composable-book.p42"><img loading="eager" decoding="sync" src="/estate/essays/the-composable-book/assets/04-semantic-ledger.svg" alt="The source is versioned separately from the browser projection. A visible edit first becomes an inspectable proposed semantic difference." width="1400" height="820"/><figcaption>FIG. 04The source is versioned separately from the browser projection. A visible edit first becomes an inspectable proposed semantic difference.</figcaption></figure><p class="frame-subheading" data-source-block="the-composable-book.p43" data-source-from="0" data-source-to="30">The proof a product must offer</p><p data-source-block="the-composable-book.p44" data-source-from="0" data-source-to="59">The first demonstration should be modest enough to falsify.</p><p data-source-block="the-composable-book.p45" data-source-from="0" data-source-to="347">Open the same book on macOS and Linux. In Composer, propose a new interactive region that can be expressed from existing admitted primitives. Let the model construct a typed composition proposal. Preview it in a React/DOM projection. Change its placement, inspect what changed semantically, authorize the edit, and reopen the work on another host.</p><p data-source-block="the-composable-book.p46" data-source-from="0" data-source-to="348">The source identity must survive. So must the dialogue, the region's semantic identity, and its capability bindings. The same admitted operation must have the same meaning even if typography, available input methods, or page dimensions differ. An unavailable browser feature may change the visual method; it must not invent another semantic result.</p><p data-source-block="the-composable-book.p47" data-source-from="0" data-source-to="278">A second demonstration should deliberately request a behavior that no installed instrument can perform. Reframe must be able to say so. Conversation continues, while execution remains unavailable. Only a separately validated and authorized new instrument may change that answer.</p><p data-source-block="the-composable-book.p48" data-source-from="0" data-source-to="344">Neither test is yet complete. The current native codex presentation has been exercised on the Mac; Linux headless portability is partial; Linux GUI and iPadOS authoring parity remain to be admitted and independently verified. The <a href="https://governance.fountain.coach/chapters/115-semantic-browser-is-a-governed-midi2-and-fountainstore-instrument/" target="_blank" rel="noopener noreferrer">semantic browser contract</a> establishes further boundaries but does not itself constitute a complete browser client.</p><p data-source-block="the-composable-book.p49" data-source-from="0" data-source-to="126">The distinction between an ambition and a witnessed product is one of the most valuable things this architecture can preserve.</p><p class="frame-subheading" data-source-block="the-composable-book.p50" data-source-from="0" data-source-to="26">A book that remains a book</p><p data-source-block="the-composable-book.p51" data-source-from="0" data-source-to="188">The ambition is not to replace literature with interactive novelty. The simplest book should remain simple. A sentence may need nothing beyond a quiet page and somebody willing to read it.</p><p data-source-block="the-composable-book.p52" data-source-from="0" data-source-to="112">But simplicity should be a choice made within an expressive medium, not a limitation imposed by the application.</p><p data-source-block="the-composable-book.p53" data-source-from="0" data-source-to="250">A writer should be free to invent a different kind of page, to work out its meaning with a model, to let the model implement what can be implemented, and to publish the result without surrendering authorship to either the model or the software stack.</p><p data-source-block="the-composable-book.p54" data-source-from="0" data-source-to="164">That is the product idea behind the composable book. It keeps the integrity of a book while refusing to decide, once and for all, what a book is allowed to contain.</p><p data-source-block="the-composable-book.p55" data-source-from="0" data-source-to="32">Read the source essay collection</p><p data-source-block="the-composable-book.p56" data-source-from="0" data-source-to="18">open First Reading</p><p data-source-block="the-composable-book.p57" data-source-from="0" data-source-to="16">CONTINUE READING</p><p class="frame-subheading" data-source-block="the-composable-book.p58" data-source-from="0" data-source-to="20">A connected argument</p><p data-source-block="the-composable-book.p59" data-source-from="0" data-source-to="125">These routes separate the conceptual proposal from the existing implementations, independent essays, and governing contracts.</p><p data-source-block="the-composable-book.p60" data-source-from="0" data-source-to="86"><a href="/" target="_blank" rel="noopener noreferrer">Reframe — Product</a><span>Reframe public estate; Mac implementation source is collaborator-only</span></p><p data-source-block="the-composable-book.p61" data-source-from="0" data-source-to="93"><a href="https://governance.fountain.coach/chapters/58-open-turn-mediation-protocol/" target="_blank" rel="noopener noreferrer">Chapter 58 — Open-turn mediation</a><span>Public governance behind the draft R27 collaboration scenario</span></p><p data-source-block="the-composable-book.p62" data-source-from="0" data-source-to="85"><a href="https://governance.fountain.coach/chapters/83-conversational-scenario-authoring/" target="_blank" rel="noopener noreferrer">Chapter 83 — Conversational authoring</a><span>How writer and model design executable scenarios</span></p><p data-source-block="the-composable-book.p63" data-source-from="0" data-source-to="70"><a href="https://governance.fountain.coach/chapters/108-reframe-is-a-swift-native-cross-platform-runtime/" target="_blank" rel="noopener noreferrer">Chapter 108 — Portable runtime</a><span>Platform-neutral semantics and execution</span></p><p data-source-block="the-composable-book.p64" data-source-from="0" data-source-to="56"><a href="https://governance.fountain.coach/chapters/124-midi2-timed-webkit-transitions/" target="_blank" rel="noopener noreferrer">Chapter 124 — Timed WebKit</a><span>DOM as governed visual surface</span></p><p data-source-block="the-composable-book.p65" data-source-from="0" data-source-to="63"><a href="/estate/essays/semantic-compilation-the-archive-is-not-the-edition/" target="_blank" rel="noopener noreferrer">Semantic Compilation essay</a><span>An edition is authored, not harvested</span></p><p data-source-block="the-composable-book.p66" data-source-from="0" data-source-to="79"><a href="/estate/essays/reframe-and-the-business-value-of-the-estate/" target="_blank" rel="noopener noreferrer">Reframe and Business Value</a><span>Why independent publishing needs operational identity</span></p><p data-source-block="the-composable-book.p67" data-source-from="0" data-source-to="37"><a href="/estate/essays/teatro-an-unfinished-composition/" target="_blank" rel="noopener noreferrer">Teatro essay</a><span>An unfinished composition</span></p></article></section></div></template>
<template data-reader-volume="essay--to-read-is-not-to-remember"><div class="book-flow" data-min-leaves="1"><section class="book-chapter" id="work-to-read-is-not-to-remember"><div class="book-chapter-heading"><h2 data-source-block="to-read-is-not-to-remember.title">Did the Machine Actually Read the Book?</h2></div></section><section class="book-chapter-text"><article class="book-prose"><figure class="frame-reading-figure" data-source-block="to-read-is-not-to-remember.p1"><img loading="eager" decoding="sync" src="/estate/essays/to-read-is-not-to-remember/assets/bookshelf-ipad-landscape-test.png" alt="Actual iPad landscape visual-test capture of the Fountain Coach Bookshelf with its publisher mark, two book covers and empty publication slots." width="1180" height="820"/></figure><p class="frame-subheading" data-source-block="to-read-is-not-to-remember.p2" data-source-from="0" data-source-to="39">Did the Machine Actually Read the Book?</p><p data-source-block="to-read-is-not-to-remember.p3" data-source-from="0" data-source-to="71"><em>On artificial intelligence, memory, and the continuity of understanding</em></p><p data-source-block="to-read-is-not-to-remember.p4" data-source-from="0" data-source-to="240">Ask an AI to read a novel, and it will probably give you an answer. It may be eloquent, convincing, even beautifully written. But ask a different question — <em>Did you actually read the entire book?</em> — and things become considerably less clear.</p><p data-source-block="to-read-is-not-to-remember.p5" data-source-from="0" data-source-to="348">A language model can receive thousands of pages without understanding how their events relate. It can retrieve a passage without remembering what preceded it. It can produce a persuasive interpretation from fragments while giving the impression of having considered the whole. A progress bar reaching one hundred percent proves surprisingly little.</p><p data-source-block="to-read-is-not-to-remember.p6" data-source-from="0" data-source-to="334">The problem is not simply that artificial intelligence forgets. Human readers forget, too. Yet reading is more than accumulating information. We form expectations, encounter contradictions, reconsider earlier judgments. Sometimes the meaning of a sentence changes only after another hundred pages. Understanding develops through time.</p><p data-source-block="to-read-is-not-to-remember.p7" data-source-from="0" data-source-to="452">This is the problem we encountered while developing <strong>Reframe</strong>, Fountain Coach’s reading and writing environment. Early experiments with James Joyce’s <em>Ulysses</em> produced familiar AI failures: invented relationships, confused identities, and apparently insightful observations that could not be justified by the text. Attempts to remember everything created another danger. A system’s previous interpretations began acquiring authority they had never earned.</p><p data-source-block="to-read-is-not-to-remember.p8" data-source-from="0" data-source-to="55">Our response was to distinguish memory from continuity.</p><p data-source-block="to-read-is-not-to-remember.p9" data-source-from="0" data-source-to="255"><strong>Reading Continuity</strong> records which parts of a work have been examined, what evidence emerged, which questions remain open, and where an interpretation may need reconsideration. It does not pretend that every previous passage remains inside the model’s mind.</p><p data-source-block="to-read-is-not-to-remember.p10" data-source-from="0" data-source-to="255"><strong>Drift Calculus</strong> takes the next step. It examines how interpretations change as reading progresses and how independent readings disagree. Difference is not automatically error. Agreement is not automatically truth. Both become reasons to return to the text.</p><p data-source-block="to-read-is-not-to-remember.p11" data-source-from="0" data-source-to="300">The result is an unusual proposition: the continuity of understanding need
