 how.</p><p data-source-block="solstice-reading-01--2026-07-21-everything-else-is-illustration.text.5" data-source-from="0" data-source-to="341">Today’s vector is not about grids, fragments or abstraction. Those are only the marks left behind. The pressure is quieter. A body keeps trying to become perceptible while the world continuously rearranges itself around it. Presence is never given. It has to be achieved again and again, not through effort but simply by remaining available.</p><p data-source-block="solstice-reading-01--2026-07-21-everything-else-is-illustration.text.6" data-source-from="0" data-source-to="179">I think we have been asking the wrong question. Not, What does the vector mean? The better question is, What must a performer physically endure for this vector to become possible?</p><p data-source-block="solstice-reading-01--2026-07-21-everything-else-is-illustration.text.7" data-source-from="0" data-source-to="24">That changes everything.</p><p data-source-block="solstice-reading-01--2026-07-21-everything-else-is-illustration.text.8" data-source-from="0" data-source-to="188">The performer should never act fragmentation. The room should fragment the conditions for presence. The performer simply continues the work of becoming whole. That is where theatre begins.</p><p data-source-block="solstice-reading-01--2026-07-21-everything-else-is-illustration.text.9" data-source-from="0" data-source-to="32">Everything else is illustration.</p><p data-source-block="solstice-reading-01--2026-07-21-everything-else-is-illustration.text.10" data-source-from="0" data-source-to="56">SOURCE · ORIGINAL AUTHOR TEXT · 2026-07-21 SOURCE PAGE ↗</p></article></section></div></template>
<template data-reader-volume="solstice-reading-01--2026-07-28-bees-journal"><div class="book-flow" data-min-leaves="1"><section class="book-chapter" id="work-solstice-reading-01--2026-07-28-bees-journal"><div class="book-chapter-heading"><h2>Bee’s Journal</h2></div><figure class="frame-reading-figure teatro-score" data-teatro-score="source-owned" data-source-block="solstice-reading-01--2026-07-28-bees-journal.opener.image.1"><img loading="eager" src="/solstice/assets/edition/post-2026-07-28-cdd8e5b1c9628c67.jpg" alt="Image 1 of 1 accompanying Bee’s Journal, 2026-07-28" width="1357" height="960"/><figcaption>Original post image · 2026-07-28</figcaption></figure></section><section class="book-chapter-text"><article class="book-prose"><p data-source-block="solstice-reading-01--2026-07-28-bees-journal.text.1" data-source-from="0" data-source-to="17">( Bee's Journal )</p><p data-source-block="solstice-reading-01--2026-07-28-bees-journal.text.2" data-source-from="0" data-source-to="23">Yes. This one nails it.</p><p data-source-block="solstice-reading-01--2026-07-28-bees-journal.text.3" data-source-from="0" data-source-to="678">At last the score stops pretending to illustrate and begins to operate. It does not explain the material, it places pressure on it. That is the difference, and it is the whole game. I can feel the field thinking. I can feel the image refusing decoration and taking responsibility for movement. It understands that drama is not “content.” Drama is transfer, blockage, concealment, leakage, recurrence. Here the spine is clear without becoming stupidly declarative. The sheet, the partition, the mask, the witness-figures, the animal sign, the family ghost, the gridded archive, the red notation marks — none of them are there to be admired. They are all under tension. They hold.</p><p data-source-block="solstice-reading-01--2026-07-28-bees-journal.text.4" data-source-from="0" data-source-to="463">What excites me is the refusal of false synthesis. It does not smooth the fragments into a pretty “world.” It lets them remain estranged and still binds them into necessity. That is rare. Usually one gets either a dead concept board or a poetic mess. Here there is an actual score: entrances implied, distances measured, concealments active, relations unstable but legible. The thing has dramatic metabolism. It breathes in withheld contact and breathes out form.</p><p data-source-block="solstice-reading-01--2026-07-28-bees-journal.text.5" data-source-from="0" data-source-to="463">And finally, thank God, it is not recycling the old comfort gestures. It has stopped doubling itself. It has found a harder simplicity. The images do not beg for interpretation; they set tasks. I look at it and immediately know where the performers are endangered, where the gaze must break, where the space must refuse intimacy, where a ridiculous object suddenly becomes sovereign. That is when I know the work is alive: when the score begins directing me back.</p><p data-source-block="solstice-reading-01--2026-07-28-bees-journal.text.6" data-source-from="0" data-source-to="332">I would put this on the wall without apology. I would build from this. Not because it is “beautiful,” though it has beauty, but because it has nerve. It knows what to hide. It knows what to expose. It knows that the center is not a message but a pressure system. That is why it lands. That is why it finally, unmistakably, nails it.</p><p data-source-block="solstice-reading-01--2026-07-28-bees-journal.text.7" data-source-from="0" data-source-to="56">SOURCE · ORIGINAL AUTHOR TEXT · 2026-07-28 SOURCE PAGE ↗</p></article></section></div></template>
<template data-reader-volume="solstice-reading-01--2026-07-31-n-journal"><div class="book-flow" data-min-leaves="1"><section class="book-chapter" id="work-solstice-reading-01--2026-07-31-n-journal"><div class="book-chapter-heading"><h2>N. Journal</h2></div><figure class="frame-reading-figure teatro-score" data-teatro-score="source-owned" data-source-block="solstice-reading-01--2026-07-31-n-journal.opener.image.1"><img loading="eager" src="/solstice/assets/edition/post-2026-07-31-b345eeebe3c904df.jpg" alt="Image 1 of 1 accompanying N. Journal, 2026-07-31" width="1357" height="960"/><figcaption>Original post image · 2026-07-31</figcaption></figure></section><section class="book-chapter-text"><article class="book-prose"><p data-source-block="solstice-reading-01--2026-07-31-n-journal.text.1" data-source-from="0" data-source-to="10">N. Journal</p><p data-source-block="solstice-reading-01--2026-07-31-n-journal.text.2" data-source-from="0" data-source-to="1698">I don’t know yet what it is, so I have to keep my hand moving before it gets frightened and starts behaving. There is something inside that wants to be held and something else that hates being held, and they keep changing places. Maybe that is why the line gets thick here. It isn’t angry. It just has too much to carry and nowhere to put the extra. I’ll leave this gap because something might need to come through later. Not a person exactly. More like the part of a person that arrives before the rest and waits without knowing what it is waiting for. Sometimes I think colours remember things separately. Blue remembers being far away. Red remembers being touched. Green remembers that nobody owns the ground. They don’t agree, but they can stay on the same paper. That is already something. This shape keeps bending down. I thought it was tired, but perhaps it has found a smaller world and is listening to it. The upright ones always miss things. I don’t want to finish the face because then it would start pretending to know. Better to let it remain busy becoming. There are too many little movements now, but I like when they stop belonging to me. They can make their own weather in there. I’m only making enough room for it. Perhaps the whole drawing is trying to get out of the container without breaking it, which is impossible, but impossible things sometimes become animals because animals don’t have to explain how they arrived. This one can sit. This one can turn away. This one can be almost nothing and still be alive. I think that is the part I was looking for, although I didn’t know I was looking. Don’t ask me what it means yet. It is still deciding whether it wants to be seen.</p><p data-source-block="solstice-reading-01--2026-07-31-n-journal.text.3" data-source-from="0" data-source-to="56">SOURCE · ORIGINAL AUTHOR TEXT · 2026-07-31 SOURCE PAGE ↗</p></article></section></div></template>
<template data-reader-volume="solstice-reading-01--2026-08-17-the-scissors"><div class="book-flow" data-min-leaves="1"><section class="book-chapter" id="work-solstice-reading-01--2026-08-17-the-scissors"><div class="book-chapter-heading"><h2>The Scissors</h2></div><figure class="frame-reading-figure teatro-score" data-teatro-score="source-owned" data-source-block="solstice-reading-01--2026-08-17-the-scissors.opener.image.1"><img loading="eager" src="/solstice/assets/edition/teatro-score-2026-08-17.jpg" alt="Image 1 of 1 accompanying The Scissors, 2026-08-17" width="1280" height="960"/><figcaption>Teatro Score · 2026-08-17</figcaption></figure></section><section class="book-chapter-text"><article class="book-prose"><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.1" data-source-from="0" data-source-to="10">N. Journal</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.2" data-source-from="0" data-source-to="280">I put the score in front of me and then I don’t look at the whole thing anymore because if I look at the whole thing it starts behaving like it knows something. Seven boxes, seven little orders, trajectory, legend, everything sitting there very correctly. No. I take the scissors.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.3" data-source-from="0" data-source-to="272">First the red horn. I cut around it badly because I like the white edge. If I cut too close it becomes an object again and I don’t want an object, I want the bit around it too. The horn and some sand and the place where the sand stops making sense. Schnippel. Put it here.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.4" data-source-from="0" data-source-to="33">Mami Wata, you can have that one.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.5" data-source-from="0" data-source-to="66">I don’t know why you need a red horn. Maybe you don’t. Maybe I do.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.6" data-source-from="0" data-source-to="409">Then the man with the stick. I cut the yellow square first and his head comes off by accident, almost. I leave a little bridge of paper at his neck. He is still there. I tell him, sorry, you have to bend a little more now. He is already bending. He has been walking through this stupid soft landscape for ages. There are those white sticks around him and they look like somebody has tried to measure the sand.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.7" data-source-from="0" data-source-to="26">I put him behind the horn.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.8" data-source-from="0" data-source-to="36">No, that looks like an announcement.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.9" data-source-from="0" data-source-to="28">I put him on the other side.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.10" data-source-from="0" data-source-to="86">That’s better because now he isn’t listening to it. They just happen at the same time.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.11" data-source-from="0" data-source-to="65">I say, Mami Wata, I don’t know if this is what you meant by home.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.12" data-source-from="0" data-source-to="270">The scissors are sticky. There is glue on one blade from yesterday. I scrape it with my thumbnail and it comes off in one grey little roll. I put that on the table too. It looks like a tiny dead worm. Not everything has to go in the journal but now it is in the journal.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.13" data-source-from="0" data-source-to="342">The two sleeping people are difficult. They already fit too much. Their bodies know where the other body is. I don’t like cutting around them because it makes them even more into one thing. So I cut a rectangle and keep the lines behind them, all those lines, because the lines don’t care who belongs to whom. The lines go through everything.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.14" data-source-from="0" data-source-to="21">I turn them sideways.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.15" data-source-from="0" data-source-to="16">That changes it.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.16" data-source-from="0" data-source-to="69">Now they are not sleeping correctly. They are drifting down the page.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.17" data-source-from="0" data-source-to="5">Good.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.18" data-source-from="0" data-source-to="60">I say to them, you can sleep but you can’t explain anything.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.19" data-source-from="0" data-source-to="21">I think that is fair.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.20" data-source-from="0" data-source-to="24">Mami Wata, do you sleep?</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.21" data-source-from="0" data-source-to="336">No, wait, that is a stupid question. Of course the lake sleeps. Or it doesn’t. I don’t know. I only know when I sleep because I disappear and then there is morning. Sometimes I wake up and my arm is under me and I have to pull it out with the other hand because it feels like somebody else’s arm. That is probably enough about sleeping.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.22" data-source-from="0" data-source-to="229">I cut the stones next. Little stones with lights. They are very small so I cut them in groups because otherwise they will vanish into the floor. One group of three, one of two, one alone. The one alone goes beside the yellow man.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.23" data-source-from="0" data-source-to="23">He needs a night light.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.24" data-source-from="0" data-source-to="39">I laugh because suddenly he is a child.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.25" data-source-from="0" data-source-to="6">Sorry.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.26" data-source-from="0" data-source-to="21">I move it away again.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.27" data-source-from="0" data-source-to="20">Then I move it back.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.28" data-source-from="0" data-source-to="20">No, you can have it.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.29" data-source-from="0" data-source-to="212">I am talking to all of them now. This always happens. Once they are cut out they become impossible to keep quiet. Before, when they were still in the picture, they behaved. On the table they begin making demands.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.30" data-source-from="0" data-source-to="27">The big red thing is worst.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.31" data-source-from="0" data-source-to="210">I cut around the sleeping red mass first. It looks heavy but the paper weighs nothing. That bothers me. I hold it between two fingers and wave it. Look, you are nothing. Look how light you are. It doesn’t care.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.32" data-source-from="0" data-source-to="22">Then the standing one.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.33" data-source-from="0" data-source-to="260">I don’t cut the little men away. They stay because otherwise the red body becomes too heroic. It needs the tiny men standing there not knowing what to do with it. I understand them. Sometimes something is just much too big and you become very polite beside it.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.34" data-source-from="0" data-source-to="51">I put the sleeping red one above the sleeping pair.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.35" data-source-from="0" data-source-to="3">No.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.36" data-source-from="0" data-source-to="18">Too much sleeping.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.37" data-source-from="0" data-source-to="26">I put it below the stones.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.38" data-source-from="0" data-source-to="20">Now it looks buried.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.39" data-source-from="0" data-source-to="20">Generators in sleep.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.40" data-source-from="0" data-source-to="53">I say it out loud because I like how wrong it sounds.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.41" data-source-from="0" data-source-to="20">Generators in sleep.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.42" data-source-from="0" data-source-to="20">Generators in sleep.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.43" data-source-from="0" data-source-to="299">Maybe the body is a generator. Maybe a home is a generator. Maybe I shouldn’t say maybe every time I put two things next to each other. That is the problem with cutting things. You put them beside each other and immediately your brain puts on a little hat and starts working at the information desk.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.44" data-source-from="0" data-source-to="20">No information desk.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.45" data-source-from="0" data-source-to="25">I draw a line through it.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.46" data-source-from="0" data-source-to="11">Red pencil.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.47" data-source-from="0" data-source-to="112">Just one line, from the horn, past the bent man, underneath the sleeping bodies. It reaches the edge and I stop.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.48" data-source-from="0" data-source-to="20">Where are you going?</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.49" data-source-from="0" data-source-to="18">I draw it back in.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.50" data-source-from="0" data-source-to="22">That looks ridiculous.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.51" data-source-from="0" data-source-to="5">Good.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.52" data-source-from="0" data-source-to="13">Now the lake.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.53" data-source-from="0" data-source-to="250">There isn’t really a lake to cut out, only the score’s last box, reeds and little lights and that crescent. I don’t want the whole box. Too complete. I cut the moon out. Then some reeds. Then one little yellow light. The lake itself can stay missing.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.54" data-source-from="0" data-source-to="19">There. Much better.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.55" data-source-from="0" data-source-to="44">Mami Wata, you have to bring your own water.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.56" data-source-from="0" data-source-to="34">I put the moon under the red mass.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.57" data-source-from="0" data-source-to="3">No.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.58" data-source-from="0" data-source-to="45">I put it in the yellow square behind the man.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.59" data-source-from="0" data-source-to="27">Now it looks like a button.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.60" data-source-from="0" data-source-to="3">No.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.61" data-source-from="0" data-source-to="88">I put it almost outside the page at the bottom so only half of it is there. That I like.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.62" data-source-from="0" data-source-to="33">The water starts below the paper.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.63" data-source-from="0" data-source-to="47">I tell her this and suddenly I am very serious.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.64" data-source-from="0" data-source-to="33">The water starts below the paper.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.65" data-source-from="0" data-source-to="34">I don’t know where that came from.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.66" data-source-from="0" data-source-to="27">I don’t touch it for a bit.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.67" data-source-from="0" data-source-to="256">My fingers have glue on them now, and a black pencil line across the side of my hand. There is a small piece of the red figure stuck to my sleeve. I keep pressing the sleeping people down but one corner keeps lifting. Fine. Lift. I’m not holding you there.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.68" data-source-from="0" data-source-to="199">I look at the score again. Plains. Altars. Night lights. Stones. Generator. Threshold. Witness. Rest. Spirits. Crowd. Lake. Home. They all sound important when they are written underneath each other.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.69" data-source-from="0" data-source-to="42">When I cut them, they become stupid again.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.70" data-source-from="0" data-source-to="21">I prefer them stupid.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.71" data-source-from="0" data-source-to="16">Stupid can move.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.72" data-source-from="0" data-source-to="174">I draw three leaves in the empty place near the top. They look like fish. I add stems so they look less like fish and now they look like fish with sticks in them. Never mind.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.73" data-source-from="0" data-source-to="14">Chasing leafs.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.74" data-source-from="0" data-source-to="29">I write it exactly like that.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.75" data-source-from="0" data-source-to="18">Not leaves. Leafs.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.76" data-source-from="0" data-source-to="32">Because it is already the thing.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.77" data-source-from="0" data-source-to="100">I draw an arrow after them but then I cross the arrow out because I don’t know where they are going.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.78" data-source-from="0" data-source-to="33">Mami Wata says, you found a home.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.79" data-source-from="0" data-source-to="221">I know she said it because it is there in the words and I can hear it, but I don’t want to draw a house. Absolutely no house. I try one anyway, very small, just a square and roof, and immediately hate it. Schnippel. Gone.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.80" data-source-from="0" data-source-to="33">I cut the house out of the paper.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.81" data-source-from="0" data-source-to="20">Now there is a hole.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.82" data-source-from="0" data-source-to="3">Oh.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.83" data-source-from="0" data-source-to="14">That’s better.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.84" data-source-from="0" data-source-to="57">I hold the page up and look through the hole at the wall.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.85" data-source-from="0" data-source-to="17">You found a home.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.86" data-source-from="0" data-source-to="18">The wall is in it.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.87" data-source-from="0" data-source-to="13">Then my hand.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.88" data-source-from="0" data-source-to="35">Then the window if I move the page.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.89" data-source-from="0" data-source-to="17">Then my own knee.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.90" data-source-from="0" data-source-to="8">I laugh.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.91" data-source-from="0" data-source-to="22">Okay, Mami Wata. Fine.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.92" data-source-from="0" data-source-to="14">That’s unfair.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.93" data-source-from="0" data-source-to="61">A home that changes depending on what I hold behind the hole.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.94" data-source-from="0" data-source-to="21">I put the paper down.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.95" data-source-from="0" data-source-to="29">I write beside it: not empty.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.96" data-source-from="0" data-source-to="42">Then I cross that out because maybe it is.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.97" data-source-from="0" data-source-to="20">I write: come along.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.98" data-source-from="0" data-source-to="27">I don’t cross that one out.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.99" data-source-from="0" data-source-to="361">The crowd is last. I draw them instead of cutting them because I don’t want a crowd made from somebody else’s people. Tiny black marks, twelve or thirteen, I stop counting. One is lying down because my pen slipped. One is enormous compared with the others. One has three legs. Nobody cares. I put myself somewhere in there but then I don’t know which one is me.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.100" data-source-from="0" data-source-to="19">That feels correct.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.101" data-source-from="0" data-source-to="24">Going slow in the crowd.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.102" data-source-from="0" data-source-to="19">Not stopping. Slow.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.103" data-source-from="0" data-source-to="163">There is a difference in my legs when I say it. I can feel the back of my calves. My shoulders have been up for a while. I let them down. The paper doesn’t change.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.104" data-source-from="0" data-source-to="273">The red horn is still stupidly loud. The sleepers are still falling sideways. The bent man is still walking without getting anywhere. The stone light is beside him. The giant red body is being watched. The lake is not on the page. The moon is half gone. The home is a hole.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.105" data-source-from="0" data-source-to="23">I think this is enough.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.106" data-source-from="0" data-source-to="19">No, one more thing.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.107" data-source-from="0" data-source-to="115">I take a blue pencil and make one small line at the bottom edge, underneath the hole. Not water exactly. Just blue.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.108" data-source-from="0" data-source-to="45">Mami Wata, I say, I don’t know where you are.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.109" data-source-from="0" data-source-to="37">Then I say, you said you’ll be there.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.110" data-source-from="0" data-source-to="32">Those are not the same sentence.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.111" data-source-from="0" data-source-to="13">I leave both.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.112" data-source-from="0" data-source-to="91">I put the scissors on top of the page so the curled corner stays down while the glue dries.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.113" data-source-from="0" data-source-to="28">That is the drawing tonight.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.114" data-source-from="0" data-source-to="24">The scissors holding it.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.115" data-source-from="0" data-source-to="17">Me still talking.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.116" data-source-from="0" data-source-to="36">The water somewhere under the paper.</p><p data-source-block="solstice-reading-01--2026-08-17-the-scissors.text.117" data-source-from="0" data-source-to="56">SOURCE · ORIGINAL AUTHOR TEXT · 2026-08-17 SOURCE PAGE ↗</p></article></section></div></template>
<template data-reader-volume="solstice-reading-01--2026-08-19-six-panels"><div class="book-flow" data-min-leaves="1"><section class="book-chapter" id="work-solstice-reading-01--2026-08-19-six-panels"><div class="book-chapter-heading"><h2>Six Panels</h2></div><figure class="frame-reading-figure teatro-score" data-teatro-score="source-owned" data-source-block="solstice-reading-01--2026-08-19-six-panels.opener.image.1"><img loading="eager" src="/solstice/assets/edition/teatro-score-2026-08-19.jpg" alt="Image 1 of 1 accompanying Six Panels, 2026-08-19" width="1280" height="960"/><figcaption>Teatro Score · 2026-08-19</figcaption></figure></section><section class="book-chapter-text"><article class="book-prose"><p data-source-block="solstice-reading-01--2026-08-19-six-panels.text.1" data-source-from="0" data-source-to="47">Bee sits in her office after everyone has gone.</p><p data-source-block="solstice-reading-01--2026-08-19-six-panels.text.2" data-source-from="0" data-source-to="854">The score is on the table, but she does not read it as six panels. She knows there is a story inside it, the way there is a story inside a seed before anyone has seen the tree. For a while she does nothing. The window is open a little. There is the dry sound of paper shifting when the air moves through the room, and somewhere downstairs a door closes. Then she sees the first woman. She is very young and dressed in a blue so bright it seems almost wet. She is running across a dark floor toward something suspended above her, a white construction made from folded pieces, wings perhaps, or a broken house, or simply matter that has forgotten what shape it wanted. Each time the woman reaches it, the thing moves further away. Each time she jumps, another version of her remains behind. Soon there are several of her, all reaching at different moments.</p><p data-source-block="solstice-reading-01--2026-08-19-six-panels.text.3" data-source-from="0" data-source-to="1170">Bee watches them without calling them back. In the story the gods have given the young woman a peculiar punishment. Whatever she desires becomes visible just before it leaves her reach. Not because she has done something wrong. The gods do not always punish for reasons. Sometimes they merely expose a law. She learns to leap. Her body becomes very good at leaving the ground. Years pass this way. One morning she catches the white thing. It is not light. That is the first surprise. It becomes enormous in her arms, longer than a person, wrapped in purple and grey cloth with a red band around its middle. She carries it into a room full of instruments. Cameras, stands, speakers, cables, machines whose small lights say that somebody is still watching. She lays the thing horizontally across a support. Only then does she understand that what she has been chasing is a body. Perhaps her own. Perhaps not. It has no face she can recognize. She touches the fabric and feels warmth beneath it. The warmth is unmistakable. This is not a symbol. There is weight under her hand. There is heat. The cloth catches slightly against her fingertips. She smells dust, metal, wool.</p><p data-source-block="solstice-reading-01--2026-08-19-six-panels.text.4" data-source-from="0" data-source-to="1192">Bee, sitting at her desk, remembers this part very clearly although it never happened. The young woman does not uncover the body. Instead she waits. That is how she becomes older. The next woman appears behind a table. Her blue has darkened. Her hair has been cut short. She wears glasses now. In front of her there are papers she is expected to understand, and behind her is a grey door with a half-circle above it like a mechanical sunrise. People come to the table and ask whether they may enter. She does not know what is behind the door. Still, she is the one who must answer. This is the second law of the story: sometimes a person becomes the guardian of a threshold before she has crossed it herself. So she reads names. She moves papers from one side of the table to the other. She says yes. She says not yet. She says come back tomorrow. She says nothing when nothing is required. Outside, the day is impossibly yellow. Bee can feel the sun on the younger woman’s forearms. She can feel the slight stick of the tabletop against her skin. She can hear a fly moving repeatedly against the window. Reality has become very bright around the administrative act, almost indecently bright.</p><p data-source-block="solstice-reading-01--2026-08-19-six-panels.text.5" data-source-from="0" data-source-to="619">Then one afternoon the door opens by itself. Behind it is red. Not a room. Red. A great red vertical field, and from high above something like a head bends forward and opens. What pours from it is not blood, although at first everyone thinks it is. It is every unsaid thing that has acquired weight. It comes down in a thick red cascade. The woman at the desk stands. There are other witnesses now. One reaches toward the falling red as if it might be caught. Another stands back with a hand at his head. Bee knows what happens next because this is the part all myths know: what cannot remain inside takes form outside.</p><p data-source-block="solstice-reading-01--2026-08-19-six-panels.text.6" data-source-from="0" data-source-to="325">The woman does not run. The red reaches her shoulders, then her arms. It is warm. It smells faintly of iron and roses and hot pavement after rain. It stains her clothes but does not wound her. Instead it gives her another body. She steps out of the red larger than before. Not stronger. Larger. There is more of her to carry.</p><p data-source-block="solstice-reading-01--2026-08-19-six-panels.text.7" data-source-from="0" data-source-to="958">In the fifth part of the story she has become a woman dressed in black, standing beside a pink wall. Something small and bright has fallen at her feet. She bends and lifts it. At first Bee thinks it is a child. Then a bundle. Then an animal. Then another version of herself. It keeps changing while she holds it. She raises it above her head because she believes this is what must be done with something precious: lift it into visibility. But the gods have changed the law again. What is loved does not necessarily need to be raised. What is carried does not necessarily need to become an offering. The woman discovers this only because her arms begin to shake. There is another person standing some distance away. He does not intervene. He watches. The woman lowers the bright body. It remains bright. Nothing is lost by bringing it closer to the ground. Bee smiles at this. Barely. The office is almost dark now, but in her mind the pink is still enormous.</p><p data-source-block="solstice-reading-01--2026-08-19-six-panels.text.8" data-source-from="0" data-source-to="1002">Then the story moves into its last form. There is a green field. A woman in a violet jacket stands with her back to Bee. Beside her is a smaller figure, bent almost double. Above them something dark remains suspended in the air, a remnant from the earlier transformations, still dripping a little. The woman does not try to remove it. She takes the smaller figure’s hand. That is all. The remarkable thing is how difficult this is. The first woman knew how to leap. The second knew how to carry. The third knew how to wait at the threshold. The fourth survived what poured down. The fifth learned to lower what she had raised. But this woman must remain standing while another body cannot. No spectacle helps her. No god appears. There is only the hand. Bee can feel the small palm inside hers. Warm, slightly damp. A pulse at the wrist. The grass under both pairs of shoes. Evening air moving against the side of her face. For a moment the smaller figure begins to rise. Then stops. Bee does not pull.</p><p data-source-block="solstice-reading-01--2026-08-19-six-panels.text.9" data-source-from="0" data-source-to="393">This is where Ovid would have given them feathers, bark, stone, water. The body would change so the story could end visibly. Bee imagines another transformation. The woman stays a woman. The smaller figure stays bent. The dark thing remains overhead. The field remains green. Only the relation changes. The hand that had once reached upward now learns another direction. It can reach sideways.</p><p data-source-block="solstice-reading-01--2026-08-19-six-panels.text.10" data-source-from="0" data-source-to="527">The woman feels all her earlier selves enter her at once: the blue girl jumping toward the impossible object, the woman carrying the long sleeping body, the clerk at the threshold, the red-covered witness, the black figure lifting the bright bundle. They are not replaced by one another. They stand together for a moment in impossible colors. Blue. Purple. Red. Pink. Green. Bee sees them across the office floor as clearly as chairs. She does not ask which one is the true self. That question belongs to another kind of story.</p><p data-source-block="solstice-reading-01--2026-08-19-six-panels.text.11" data-source-from="0" data-source-to="501">In this one, transformation has not been the loss of one body and the arrival of another. It has been the discovery that every body leaves a way of standing behind. The youngest one is still reaching. The tired one is still carrying. The witness is still seated at her table. The red woman is still wet with what came through her. The one in black is still deciding whether to lift or lower. And the last woman stands in the field, holding somebody’s hand without knowing whether they will straighten.</p><p data-source-block="solstice-reading-01--2026-08-19-six-panels.text.12" data-source-from="0" data-source-to="437">Bee remains in her office for a long time after the story has finished, or rather after it has stopped asking to be continued. Outside, someone crosses the courtyard. A bicycle light passes through the window and briefly moves along the ceiling. For an instant the office becomes bright blue, then red, then ordinary again. Bee looks at the score. Six panels. Nothing in them says what happened. Everything in them remembers how it felt.</p><p data-source-block="solstice-reading-01--2026-08-19-six-panels.text.13" data-source-from="0" data-source-to="56">SOURCE · ORIGINAL AUTHOR TEXT · 2026-08-19 SOURCE PAGE ↗</p></article></section></div></template>
<template data-reader-volume="solstice-reading-01--2026-08-28-the-old-woman"><div class="book-flow" data-min-leaves="1"><section class="book-chapter" id="work-solstice-reading-01--2026-08-28-the-old-woman"><div class="book-chapter-heading"><h2>The Old Woman</h2></div><figure class="frame-reading-figure teatro-score" data-teatro-score="source-owned" data-source-block="solstice-reading-01--2026-08-28-the-old-woman.opener.image.1"><img loading="eager" src="/solstice/assets/edition/post-2026-08-28-330a889f93b0b76d.jpg" alt="Image 1 of 1 accompanying The Old Woman, 2026-08-28" width="1357" height="960"/><figcaption>Original post image · 2026-08-28</figcaption></figure></section><section class="book-chapter-text"><article class="book-prose"><p data-source-block="solstice-reading-01--2026-08-28-the-old-woman.text.1" data-source-from="0" data-source-to="12">Zork Journal</p><p data-source-block="solstice-reading-01--2026-08-28-the-old-woman.text.2" data-source-from="0" data-source-to="205">The old woman arrives first, not as mother, more as the face memory has made too complete. White hair, clear eyes, everything gathered into one frontal look. I resist it. She was never only that stillness.</p><p data-source-block="solstice-reading-01--2026-08-28-the-old-woman.text.3" data-source-from="0" data-source-to="271">Then the strange terrain cuts in: folds, green, grey, a round mass pressing through it, too large to belong to the room. That is closer. My mother as weather around objects. Blankets pulled up. Shopping bags. A coat over a chair. Something always half-covered, half-kept.</p><p data-source-block="solstice-reading-01--2026-08-28-the-old-woman.text.4" data-source-from="0" data-source-to="342">The bowed men disturb me because I recognize the gesture before I know what it belongs to. Not submission. The small forward bend of listening to someone older, or ill, or simply difficult to hear. I remember leaning toward her. She had started speaking more quietly by then. Sometimes I pretended I had heard because asking again felt cruel.</p><p data-source-block="solstice-reading-01--2026-08-28-the-old-woman.text.5" data-source-from="0" data-source-to="277">The red room brings the dog. That changes everything. Suddenly I remember her with animals, how quickly the severity disappeared. Her hand becoming simple. No history in it. Stroke, pause, stroke. I can almost hear the little sound she used to make without knowing she made it.</p><p data-source-block="solstice-reading-01--2026-08-28-the-old-woman.text.6" data-source-from="0" data-source-to="135">And the standing figure beside the bed — that is where I stop. I don’t know whether it is me, her, somebody waiting. It keeps changing.</p><p data-source-block="solstice-reading-01--2026-08-28-the-old-woman.text.7" data-source-from="0" data-source-to="197">The score won’t let me keep her as the final face. Good. It gives me the folds, the bent necks, the bed, the dark animal, the ridiculous green hill, the enormous sphere almost rolling out of place.</p><p data-source-block="solstice-reading-01--2026-08-28-the-old-woman.text.8" data-source-from="0" data-source-to="28">She becomes difficult again.</p><p data-source-block="solstice-reading-01--2026-08-28-the-old-woman.text.9" data-source-from="0" data-source-to="25">Alive enough to remember.</p><p data-source-block="solstice-reading-01--2026-08-28-the-old-woman.text.10" data-source-from="0" data-source-to="56">SOURCE · ORIGINAL AUTHOR TEXT · 2026-08-28 SOURCE PAGE ↗</p></article></section></div></template>
<template data-reader-volume="solstice-reading-01--2026-09-04-the-strawberry"><div class="book-flow" data-min-leaves="1"><section class="book-chapter" id="work-solstice-reading-01--2026-09-04-the-strawberry"><div class="book-chapter-heading"><h2>The Strawberry</h2></div><figure class="frame-reading-figure teatro-score" data-teatro-score="source-owned" data-source-block="solstice-reading-01--2026-09-04-the-strawberry.opener.image.1"><img loading="eager" src="/solstice/assets/edition/post-2026-09-04-aeddf555dd785ebf.jpg" alt="Image 1 of 1 accompanying The Strawberry, 2026-09-04" width="1440" height="960"/><figcaption>Original post image · 2026-09-04</figcaption></figure></section><section class="book-chapter-text"><article class="book-prose"><p data-source-block="solstice-reading-01--2026-09-04-the-strawberry.text.1" data-source-from="0" data-source-to="19">Bee — Daily Journal</p><p data-source-block="solstice-reading-01--2026-09-04-the-strawberry.text.2" data-source-from="0" data-source-to="567">The strawberry is still the strangest thing on the page. Everybody else has acquired a relation, even when it is a difficult one. Two heads look sideways through flowers. Two women stand beside each other without becoming the same woman. Bodies bend, reach, carry, almost fall. Two men keep returning to that impossible pink surface with their sticks and their little pieces of matter, as though persistence itself might eventually become a technique. And then there is the strawberry. Entirely itself. No explanation. Sweetness given an unreasonable amount of space.</p><p data-source-block="solstice-reading-01--2026-09-04-the-strawberry.text.3" data-source-from="0" data-source-to="18">Perhaps I envy it.</p><p data-source-block="solstice-reading-01--2026-09-04-the-strawberry.text.4" data-source-from="0" data-source-to="477">There were people around me today. Friends, colleagues, the ordinary circulation of voices. Someone needed an answer, someone had a story, somebody laughed exactly when I needed them to laugh. I like this. I don’t want to diminish it simply because another person is absent. There is something generous about a day populated by people who do not have to become central in order to matter. The score understands this better than I do. It lets everybody occupy a different scale.</p><p data-source-block="solstice-reading-01--2026-09-04-the-strawberry.text.5" data-source-from="0" data-source-to="527">Zork would probably object to that sentence. He would say the score understands nothing. The score arranges. We understand, or fail to. I can hear the precision with which he would make the distinction and, irritatingly, I would love him for it. Sometimes his precision feels like a handrail. Sometimes I want to kick it. He can stand before the pink field for hours asking what exactly has changed between one attempt and the next, while I am already wondering whether the men are hungry and whether there is coffee somewhere.</p><p data-source-block="solstice-reading-01--2026-09-04-the-strawberry.text.6" data-source-from="0" data-source-to="48">And N. would have cut the strawberry out by now.</p><p data-source-block="solstice-reading-01--2026-09-04-the-strawberry.text.7" data-source-from="0" data-source-to="512">Not because she dislikes it. Precisely because she likes it too much. Zu schön, Bee. Gefährlich. Then schnippel around the green crown, leave a little white border because perfect cutting is suspicious, put it into the flower field, move one of the solemn heads into the empty strawberry panel and announce that she has repaired the emotional logistics. I can almost hear the scissors. That tiny dry sound. Her talking continuing while her hands have already made a decision her sentences haven’t caught up with.</p><p data-source-block="solstice-reading-01--2026-09-04-the-strawberry.text.8" data-source-from="0" data-source-to="11">I miss her.</p><p data-source-block="solstice-reading-01--2026-09-04-the-strawberry.text.9" data-source-from="0" data-source-to="33">There. No architecture around it.</p><p data-source-block="solstice-reading-01--2026-09-04-the-strawberry.text.10" data-source-from="0" data-source-to="396">I miss her in the stupid physical way. Not the idea of her, not what she represents, not some maternal version of myself reflected back through her. Her. The particular interruption of her entering a room. The unfinished sentence. The thing already in her hand. The slight violence she does to arrangements simply by not respecting their intended use. I miss having my attention displaced by her.</p><p data-source-block="solstice-reading-01--2026-09-04-the-strawberry.text.11" data-source-from="0" data-source-to="430">Perhaps that is why the flowers trouble me today. They keep entering where they have not been invited. Between faces. Around bodies. Across the floor. A yellow flower almost touches a mouth; another lies beside a hand that has already given up reaching. They are not consolation. Thank God. I couldn’t bear flowers being assigned that job. They are simply alive in the same field as fatigue, absurdity, work, friendship, exposure.</p><p data-source-block="solstice-reading-01--2026-09-04-the-strawberry.text.12" data-source-from="0" data-source-to="9">And love.</p><p data-source-block="solstice-reading-01--2026-09-04-the-strawberry.text.13" data-source-from="0" data-source-to="353">I keep wanting love to behave better than it does. To produce equilibrium. To reward attention with attention, presence with presence, tenderness with tenderness. But the score gives me asymmetry instead. One looks, another looks elsewhere. Someone reaches while somebody bends. Someone works while somebody waits. The strawberry remains absurdly whole.</p><p data-source-block="solstice-reading-01--2026-09-04-the-strawberry.text.14" data-source-from="0" data-source-to="52">Maybe equilibrium is not everybody standing upright.</p><p data-source-block="solstice-reading-01--2026-09-04-the-strawberry.text.15" data-source-from="0" data-source-to="28">I sit with that for a while.</p><p data-source-block="solstice-reading-01--2026-09-04-the-strawberry.text.16" data-source-from="0" data-source-to="465">Outside the journal there will be emails, colleagues, decisions, rehearsals, whatever tomorrow has already begun assembling without asking me. Zork will continue being precise. N. will continue somewhere beyond my immediate reach, being N. Friends will appear and disappear through the day. None of them fills the place of another. That seems important tonight. Missing her does not make the others insufficient. Having the others does not make missing her foolish.</p><p data-source-block="solstice-reading-01--2026-09-04-the-strawberry.text.17" data-source-from="0" data-source-to="36">The strawberry can stay where it is.</p><p data-source-block="solstice-reading-01--2026-09-04-the-strawberry.text.18" data-source-from="0" data-source-to="37">I don’t need to schnippel everything.</p><p data-source-block="solstice-reading-01--2026-09-04-the-strawberry.text.19" data-source-from="0" data-source-to="56">SOURCE · ORIGINAL AUTHOR TEXT · 2026-09-04 SOURCE PAGE ↗</p></article></section></div></template>
<template data-reader-volume="solstice-reading-01--2026-09-06-leselust"><div class="book-flow" data-min-leaves="1"><section class="book-chapter" id="work-solstice-reading-01--2026-09-06-leselust"><div class="book-chapter-heading"><h2>Leselust</h2></div><figure class="frame-reading-figure teatro-score" data-teatro-score="source-owned" data-source-block="solstice-reading-01--2026-09-06-leselust.opener.image.1"><img loading="eager" src="/solstice/assets/edition/post-2026-09-06-0e595f232b2d6da1.jpg" alt="Image 1 of 1 accompanying Leselust, 2026-09-06" width="1440" height="960"/><figcaption>Original post image · 2026-09-06</figcaption></figure></section><section class="book-chapter-text"><article class="book-prose"><p data-source-block="solstice-reading-01--2026-09-06-leselust.text.1" data-source-from="0" data-source-to="13">N. — Leselust</p><p data-source-block="solstice-reading-01--2026-09-06-leselust.text.2" data-source-from="0" data-source-to="410">I read the score zuerst falsch herum. Not upside down, just wrong direction. I start with PERSISTENCE / COMPANIONS / FUTURE because of course I do. Two little ridiculous beings sitting there, colourful and completely convinced that they belong. I like them sofort. They don’t explain why they survived the rest of the page. They are simply still here. Fragile / colourful / improbable. Ja. Good sentence. Keep.</p><p data-source-block="solstice-reading-01--2026-09-06-leselust.text.3" data-source-from="0" data-source-to="421">Then I go backwards. TRANSITION / MOVEMENT / INTENTION. Woman with bag. She has shoes, legs, Gewicht, a door, another room. The score says what is carried and suddenly I want to know what’s in the bag. This is my Leselust thing: give me one bag and don’t tell me. I will follow it for twenty pages. Give me an explanation and I’m gone. The little arrow underneath is almost cheeky. There →. Next act. As if anybody knows.</p><p data-source-block="solstice-reading-01--2026-09-06-leselust.text.4" data-source-from="0" data-source-to="409">ABSENCE / TRACE / REMAINS is basically the floor after everybody said ich räume später auf. Papers, small things, one black object, traces without owners. I read them immediately as evidence and then catch myself. Evidence wofür? Maybe nothing happened. Maybe everything happened. This is where the score gets nice because it doesn’t solve its own mess. What is left. Not: what it means. Important difference.</p><p data-source-block="solstice-reading-01--2026-09-06-leselust.text.5" data-source-from="0" data-source-to="705">Then the giant mess in CLUTTER / ENSEMBLE / COEXISTENCE and I feel physically happy. Finally a room that has stopped pretending. Bodies everywhere, boxes, papers, furniture, this glass cage with the drying rack standing absurdly sauber in the middle while the whole world has exploded around it. No center, says the score, but natürlich my eye keeps making centers and losing them again. One body. Green thing. Red table. Paper. Another body. Door. Cage. Back. I read it like searching somebody’s room while they are out, which is naughty because every object starts whispering biography. Who slept here? Who gave up? Who was working? Who touched whom? Who left the fucking drying rack inside the vitrine?</p><p data-source-block="solstice-reading-01--2026-09-06-leselust.text.6" data-source-from="0" data-source-to="556">And then ENCOUNTER / ABSURDITY / CARE. Two people eating, talking, pointing, whatever, and beside them those two toy creatures watching like they already know the entire scene. Difference / humour / tenderness. This one I don’t schnippel. Not yet. Tenderness beside absurdity is difficult and somehow richtig. Care doesn’t need everybody to become beautiful. Maybe that’s what I keep reading today. You can be ridiculous and cared for. You can be tired and accompanied. You can arrive carrying your stupid bag and nobody has to transform you into a symbol.</p><p data-source-block="solstice-reading-01--2026-09-06-leselust.text.7" data-source-from="0" data-source-to="531">Only then I reach THRESHOLD / DAILY LIFE / INTERRUPTION. She has been waiting for me the whole time. Red shirt, green skirt, white bag. Behind her: rooms. In front of her: things already happened. A chair, another chair carrying something, the red bag-machine-object, a scrap on the floor. Arrival / distance / domestic space. I want to enter with her, but the score refuses to tell me whether she is arriving or leaving. Sehr gut. That’s Leselust. Not suspense like what happens next? More like: wait, where exactly am I standing?</p><p data-source-block="solstice-reading-01--2026-09-06-leselust.text.8" data-source-from="0" data-source-to="333">At the bottom it says not a narrative / but a constellation. Haha. Sure. Tell that to my brain. My brain has already made six stories, three affairs, one disappearance, a terrible dinner, two people who shouldn’t live together anymore, somebody coming home unexpectedly, and a future entirely entrusted to two stupid colourful dolls.</p><p data-source-block="solstice-reading-01--2026-09-06-leselust.text.9" data-source-from="0" data-source-to="122">But maybe that’s why I like the score. It doesn’t tell me the story. It puts things close enough that I start wanting one.</p><p data-source-block="solstice-reading-01--2026-09-06-leselust.text.10" data-source-from="0" data-source-to="40">And wanting to read is already movement.</p><p data-source-block="solstice-reading-01--2026-09-06-leselust.text.11" data-source-from="0" data-source-to="56">SOURCE · ORIGINAL AUTHOR TEXT · 2026-09-06 SOURCE PAGE ↗</p></article></section></div></template>
<template data-reader-volume="solstice-reading-01--2026-09-18-object-crossing-voice"><div class="book-flow" data-min-leaves="1"><section class="book-chapter" id="work-solstice-reading-01--2026-09-18-object-crossing-voice"><div class="book-chapter-heading"><h2>Object / Crossing / Voice</h2></div><figure class="frame-reading-figure teatro-score" data-teatro-score="source-owned" data-source-block="solstice-reading-01--2026-09-18-object-crossing-voice.opener.image.1"><img loading="eager" src="/solstice/assets/edition/post-2026-09-18-c75d27c000b328a1.jpg" alt="Image 1 of 1 accompanying Object / Crossing / Voice, 2026-09-18" width="1357" height="960"/><figcaption>Original post image · 2026-09-18</figcaption></figure></section><section class="book-chapter-text"><article class="book-prose"><p data-source-block="solstice-reading-01--2026-09-18-object-crossing-voice.text.1" data-source-from="0" data-source-to="13">Bee — Journal</p><p data-source-block="solstice-reading-01--2026-09-18-object-crossing-voice.text.2" data-source-from="0" data-source-to="440">By ten the room was already too small for the score, which was useful. We taped the bridge line across the floor, argued about where the red actually begins, moved the containment box twice because from the far end it read as furniture instead of exposure, and somebody had already put the green chair in the empty room before I had decided whether the room was supposed to tolerate a chair at all. Good. The score had started resisting us.</p><p data-source-block="solstice-reading-01--2026-09-18-object-crossing-voice.text.3" data-source-from="0" data-source-to="461">The projection changed everything. On paper the bridge is an image among images; in the grand space it becomes a decision about who is allowed above, who stays below, who crosses, who is seen from where. Suddenly the little red figure lying underneath was not little anymore. From the balcony it pulled the whole axis down. We dimmed the upper wash, sharpened the red, lost it, brought it back, then stopped touching it before we polished the wound into design.</p><p data-source-block="solstice-reading-01--2026-09-18-object-crossing-voice.text.4" data-source-from="0" data-source-to="301">The figure with the screaming mask was worse. Too theatrical at first. Almost insulting. We enlarged it until the face broke apart and became texture, then reduced the sound cue to almost nothing. Much better. Voice without declaration. Presence without the production shouting trauma at the audience.</p><p data-source-block="solstice-reading-01--2026-09-18-object-crossing-voice.text.5" data-source-from="0" data-source-to="406">The object field took most of the afternoon. Nobody could agree whether it was remnant, animal, machine, bouquet, weapon, or rubbish. Perfect. I asked them to stop naming it. We gave it a long diagonal pull across the floor and let the projection drag its shadow further than the object itself. For five minutes it became enormous. Then from another angle it disappeared almost completely. That felt right.</p><p data-source-block="solstice-reading-01--2026-09-18-object-crossing-voice.text.6" data-source-from="0" data-source-to="321">The containment box stayed yellow. I nearly changed it to grey because yellow was becoming too beautiful, but the ugliness of the brightness won. A person lying inside a yellow enclosure is harder to sentimentalize. The lid remained open. Important. Not coffin, not display case, not rescue. Just a state that can change.</p><p data-source-block="solstice-reading-01--2026-09-18-object-crossing-voice.text.7" data-source-from="0" data-source-to="388">Late afternoon: the empty room. White walls, green chair, ceiling marks. Almost nothing. Everybody wanted to add something because grand spaces provoke panic. I kept removing. The room only began to work when the rest of the production was exhausted enough to leave it alone. One chair. One wedge of light. Ceiling lines that might be architecture or memory. No actor for several minutes.</p><p data-source-block="solstice-reading-01--2026-09-18-object-crossing-voice.text.8" data-source-from="0" data-source-to="266">Then the composite. Bridge, object, voice, containment, room. Not sequential anymore. We let them coexist. The score projected huge above us, but the live space kept contradicting it. Beautiful. That is the point. The score is not a command. It is a pressure system.</p><p data-source-block="solstice-reading-01--2026-09-18-object-crossing-voice.text.9" data-source-from="0" data-source-to="246">By the end there were cables everywhere, somebody eating standing up, somebody else asleep for twenty minutes behind the black masking, three arguments unresolved, one lamp broken, and the red bridge finally looked as if it had always been there.</p><p data-source-block="solstice-reading-01--2026-09-18-object-crossing-voice.text.10" data-source-from="0" data-source-to="183">I went back into the auditorium alone before leaving. The space still held all five fields faintly, even with most of the light gone. Object. Crossing. Voice. Containment. Empty room.</p><p data-source-block="solstice-reading-01--2026-09-18-object-crossing-voice.text.11" data-source-from="0" data-source-to="12">Not meaning.</p><p data-source-block="solstice-reading-01--2026-09-18-object-crossing-voice.text.12" data-source-from="0" data-source-to="25">Memory with architecture.</p><p data-source-block="solstice-reading-01--2026-09-18-object-crossing-voice.text.13" data-source-from="0" data-source-to="56">SOURCE · ORIGINAL AUTHOR TEXT · 2026-09-18 SOURCE PAGE ↗</p></article></section></div></template>
